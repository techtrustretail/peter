<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Peter's Speech Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
/* Layout: one column of numbered "stations" (a real 20-minute sequence), sticky timer bar on top */
:root{
  --bg:#eef7f2; --paper:#ffffff; --ink:#2b2320; --muted:#6b5d57;
  --accent:#2fa37b; --accent-ink:#ffffff; --choc:#6b3f2a; --soft:#d8efe4; --line:#cfe3d9; --warn:#c2410c;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14201b; --paper:#1d2b25; --ink:#f1ebe7; --muted:#b5a9a2; --accent:#4cc79a; --accent-ink:#0e1a15; --choc:#e3b08f; --soft:#22392f; --line:#2f4a3e; --warn:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14201b; --paper:#1d2b25; --ink:#f1ebe7; --muted:#b5a9a2; --accent:#4cc79a; --accent-ink:#0e1a15; --choc:#e3b08f; --soft:#22392f; --line:#2f4a3e; --warn:#fb923c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}
h1,h2{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;color:var(--choc)} h2{font-size:1.35rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.clock{font:800 1.6rem var(--display);font-variant-numeric:tabular-nums;color:var(--choc);min-width:4.2ch}
button{font:700 1rem var(--body);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:var(--soft);color:var(--ink)}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--choc);outline-offset:2px}
.prog{flex:1;min-width:120px;height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.intro{color:var(--muted)}
.vn{font-size:.9rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
.st{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0}
.st.done{border-color:var(--accent)}
.head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.num{font:800 1.1rem var(--display);background:var(--choc);color:var(--paper);border-radius:10px;padding:2px 10px}
.min{margin-left:auto;font-size:.9rem;color:var(--muted)}
.mine{background:repeating-linear-gradient(var(--paper) 0 30px,var(--line) 30px 31px);padding:6px 10px;border-left:4px solid var(--choc);font-style:italic}
.fix{display:grid;gap:6px;margin:0;padding-left:20px}
.fix b{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 12px;font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lab{font:600 .8rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.machine{font-size:1.1rem;background:var(--soft);border-radius:12px;padding:12px}
.machine small{display:block;color:var(--muted);font-size:.8rem}
details{border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;color:var(--choc)}
.bank{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.bank li{background:var(--soft);border-radius:10px;padding:8px 12px}
.bank em{display:block;color:var(--muted);font-size:.92rem;font-style:normal}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:24px;height:24px;accent-color:var(--accent)}
.party{font:800 1.4rem var(--display);color:var(--accent);text-align:center}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<script id="data" type="application/json">
{
 "name":"Peter",
 "title":"Peter's Speech Builder",
 "topic":"Why Mint Chocolate City is the greatest city in the world",
 "intro":"Tonight: make Reason 1 super strong, then plan Reason 2. The machine shows examples. YOU write your own sentences in your notebook.",
 "vn":"Phụ huynh: 20 phút, 7 trạm. Máy chỉ đưa câu mẫu; con tự viết câu của mình vào vở. Mỗi trạm xong thì con tích ô ✍️.",
 "steps":[
  {"min":3,"title":"Fix-it detective","goal":"Find and fix 6 small mistakes in your Reason 1.",
   "mine":"today I am going to explain why my edible city is the most entertaining city in the world. Firstly I believe the mint chocolate city is the most entertaining city ever because it has a numbyrous floors to relax and entertain your sef. For example, you can go skateing on minty ice rink go and invite your friends to play snowball",
   "fixes":["<b>t</b>oday → capital letter at the start","Firstly<b>,</b> → comma after Firstly","<b>a</b> numbyrous → take out “a”","numbyrous → <b>num-er-ous</b> (say it in 3 parts)","your sef → <b>yourself</b> (one word)","skateing → <b>skating</b> (skate drops the e) · Mint Chocolate City → capital M, C, C"],
   "vn":"Cho con tự tìm lỗi trước 1 phút, rồi mới bấm mở gợi ý."},
  {"min":3,"title":"Answer: make the reason match the example","goal":"Your reason says “numerous floors”, but your example is skating. Choose ONE idea: the ice rink!",
   "frame":"Firstly, I believe Mint Chocolate City is the most {A} city ever because it has {B}.",
   "chips":{"A":["entertaining","magical","extraordinary","unique"],"B":["a minty ice rink","a sparkling mint chocolate ice rink","a ginormous ice rink made of mint ice cream"]},
   "bank":[{"s":"Firstly, I believe…","a":["The first reason is…","In my opinion,…","First of all,…"]},{"s":"…the most entertaining city ever","a":["…the most magical city in the world","…the coolest city on the planet"]}],
   "vn":"Điểm chính hôm nay: câu lý do phải nói về ice rink thì ví dụ trượt băng mới khớp."},
  {"min":3,"title":"For example","goal":"Tell what you can DO at the ice rink. Use two short sentences, not one long chain.",
   "frame":"For example, you can {A} on the {B} ice rink. You can also {C}.",
   "chips":{"A":["skate","glide","spin and twirl"],"B":["minty","frosty","sparkling"],"C":["invite your friends to a snowball fight","lick the mint ice cream walls","race Stormy the cloud cat"]},
   "bank":[{"s":"For example,…","a":["For instance,…","Imagine…","You can even…"]}],
   "vn":"Nhắc con: hết ý thì chấm câu (.), câu sau viết hoa."},
  {"min":3,"title":"Rhetorical question","goal":"Ask the audience a question they cannot say “yes” to.",
   "frame":"{A}",
   "chips":{"A":["Which city have you visited that has an ice rink made of ice cream?","Have you ever skated on mint chocolate?","Who wouldn't want to skate on a minty ice rink?"]},
   "bank":[{"s":"Which city have you visited that…?","a":["Have you ever…?","Who wouldn't want to…?","Can you imagine…?"]}],
   "vn":"Câu hỏi tu từ kết thúc bằng dấu ?"},
  {"min":3,"title":"Feelings + WOW word","goal":"Tell the audience how they will feel. Use one WOW adjective.",
   "frame":"You will feel {A} and {B} on this {C} ice rink.",
   "chips":{"A":["excited","thrilled","amazed"],"B":["frozen with joy","as cool as a penguin","full of happiness"],"C":["extraordinary","sensational","unforgettable","magical"]},
   "bank":[{"s":"You will feel…","a":["You will be…","Everyone will feel…","Your heart will…"]}],
   "vn":"WOW words trên bảng của thầy: extraordinary, unforgettable, sensational, majestic, magical."},
  {"min":2,"title":"You should…","goal":"Finish Reason 1 with a modal sentence and a reason.",
   "frame":"You {A} visit this {B} ice rink because {C}!",
   "chips":{"A":["should","must","need to"],"B":["majestic","magical","shiny"],"C":["no other city in the world has one","it is the coolest place ever","you will never forget it"]},
   "bank":[{"s":"You should…","a":["You must…","You need to…","You will want to…"]},{"s":"…because…","a":["…so…","…as…","…which means…"]}],
   "vn":"Đổi từ nối: thử dùng so / as / which means thay cho because (điểm yếu cũ)."},
  {"min":3,"title":"Plan Reason 2: the brownie moon","goal":"Do not write the whole paragraph tonight. Just answer the 5 planning questions in your notebook in short notes.",
   "frame":"Secondly, I believe Mint Chocolate City is the most {A} city because it has {B}.",
   "chips":{"A":["delicious","mythical","futuristic","legendary"],"B":["a brownie moon covered in chocolate powder","a giant brownie moon that glows at night"]},
   "plan":["1. Answer: Secondly, I believe … because it has a brownie moon…","2. For example: what can you DO on the moon? (bounce? eat? slide down chocolate powder?)","3. Question: Have you ever…? / Which city…?","4. Feelings: You will feel … (choose a NEW WOW word)","5. You should …"],
   "bank":[{"s":"Secondly,…","a":["Another reason is…","My second reason is…","On top of that,…"]}],
   "vn":"Reason 2 tối nay chỉ cần ghi ý ngắn 5 dòng. Hôm sau viết thành đoạn."}
 ]
}
</script>

<div class="wrap">
  <div class="bar">
    <span class="clock" id="clock">20:00</span>
    <button id="go">Start 20 min</button>
    <div class="prog" aria-label="Progress"><i id="pg"></i></div>
  </div>
  <header style="display:grid;gap:8px">
    <h1 id="t"></h1>
    <div class="lab" id="topic"></div>
    <p class="intro" id="intro" style="margin:0"></p>
    <div class="vn" id="vn"></div>
  </header>
  <main id="list" class="wrap"></main>
  <p class="party" id="party" hidden>🎉 Reason 1 is super strong and Reason 2 is planned. Read it out loud like a speech!</p>
</div>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='speech-'+D.name;
let st={}; try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
st.done=st.done||{}; st.pick=st.pick||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
document.title=D.title; t.textContent=D.title; topic.textContent=D.topic; intro.textContent=D.intro; vn.textContent='🇻🇳 '+D.vn;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
  list.innerHTML='';
  D.steps.forEach((s,i)=>{
    const sec=document.createElement('section'); sec.className='st'+(st.done[i]?' done':'');
    let h=`<div class="head"><span class="num">${i+1}</span><h2>${esc(s.title)}</h2><span class="min">${s.min} min</span></div><div>${esc(s.goal)}</div>`;
    if(s.mine) h+=`<div class="lab">Your notebook now</div><div class="mine">${esc(s.mine)}</div>`;
    if(s.fixes) h+=`<details><summary>Show the 6 clues</summary><ol class="fix">${s.fixes.map(f=>`<li>${f}</li>`).join('')}</ol></details>`;
    if(s.frame){
      const p=st.pick[i]||{};
      Object.entries(s.chips).forEach(([k,arr])=>{
        h+=`<div class="chips">${arr.map((w,j)=>`<button class="chip${(p[k]??0)===j?' on':''}" data-i="${i}" data-k="${k}" data-j="${j}">${esc(w)}</button>`).join('')}</div>`;
      });
      const sent=s.frame.replace(/\{(\w)\}/g,(m,k)=>s.chips[k][p[k]??0]);
      h+=`<div class="machine"><small>🤖 Machine example (tap the words to change it)</small>${esc(sent)}</div>`;
    }
    if(s.plan) h+=`<div class="lab">Planning notes for your notebook</div><ul class="bank">${s.plan.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    if(s.bank) h+=`<details><summary>Sentence Bank</summary><ul class="bank">${s.bank.map(b=>`<li>${esc(b.s)}<em>🔁 You can also use: ${b.a.map(esc).join(' · ')}</em></li>`).join('')}</ul></details>`;
    h+=`<div class="vn">🇻🇳 ${esc(s.vn)}</div>`;
    h+=`<label class="check"><input type="checkbox" id="c${i}" data-c="${i}" ${st.done[i]?'checked':''}> ✍️ I wrote my own sentence in my notebook</label>`;
    sec.innerHTML=h; list.appendChild(sec);
  });
  const n=Object.values(st.done).filter(Boolean).length;
  pg.style.width=(100*n/D.steps.length)+'%'; party.hidden=n<D.steps.length;
}
list.addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b)return;
  const i=b.dataset.i; st.pick[i]=st.pick[i]||{}; st.pick[i][b.dataset.k]=+b.dataset.j; save(); render();});
list.addEventListener('change',e=>{const c=e.target.dataset.c; if(c==null)return; st.done[c]=e.target.checked; save(); render();});
let left=20*60, timer=null;
const show=()=>clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
go.onclick=()=>{ if(timer){clearInterval(timer);timer=null;go.textContent='Resume';return;}
  go.textContent='Pause'; timer=setInterval(()=>{left=Math.max(0,left-1);show(); if(!left){clearInterval(timer);timer=null;go.textContent='Time!';}},1000);};
render();
</script>
