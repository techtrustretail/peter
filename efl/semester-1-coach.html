<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stormy's Revision Coach</title>
<style>
:root{--bg:#eafaf3;--card:#fff;--ink:#3b2a20;--soft:#7a6656;--mint:#2bb38a;--mint2:#c9f2e2;--choc:#6b3f26;--gold:#f2b632;--red:#e2574c;--line:#e3d9cf}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17221e;--card:#22302b;--ink:#f3ece4;--soft:#c2b4a6;--mint2:#1f4a3c;--line:#3a4a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Comic Sans MS","Chalkboard SE","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(135deg,#2bb38a,#6b3f26);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:0;border-radius:999px;padding:10px 16px;font:inherit;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.tab.on{background:var(--mint);color:#fff}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 0 var(--line)}
.pg{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.pg h3{margin:0;font-size:20px}
.badge{font-size:14px;background:var(--mint2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.q{border-top:2px dashed var(--line);padding:12px 0}
.qn{display:inline-block;background:var(--choc);color:#fff;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px;margin-right:6px;font-size:15px}
.qt{font-weight:bold}
.help{color:var(--soft);margin:6px 0}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
button.s{border:0;border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;cursor:pointer;background:var(--mint2);color:var(--ink)}
button.go{background:var(--mint);color:#fff}
.box{border-radius:12px;padding:10px 12px;margin:6px 0;font-size:17px}
.hint{background:#fff6dc;color:#5a4300}.ex{background:#e8f1ff;color:#1f3b6b}.fix{background:#ffe9e6;color:#7a2018}.ok{background:#dcf7ea;color:#0d5c3f}.no{background:#ffe9e6;color:#7a2018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hint{background:#4a3d14;color:#ffe9a8}:root:not([data-theme="light"]) .ex{background:#1d3150;color:#cfe0ff}:root:not([data-theme="light"]) .fix,:root:not([data-theme="light"]) .no{background:#4d2420;color:#ffd2cc}:root:not([data-theme="light"]) .ok{background:#164534;color:#c6f5e1}}
textarea,input[type=text]{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px}
.star{color:var(--gold)}
.small{font-size:15px;color:var(--soft)}
.hide{display:none}
table.plan{width:100%;border-collapse:collapse;font-size:16px}table.plan td,table.plan th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.stormy{font-size:40px;float:right}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:6px 12px;margin:4px;cursor:pointer;background:var(--card);user-select:none}
.chip.sel{background:var(--gold);color:#3b2a20;border-color:var(--gold)}
.vi{font-family:system-ui,sans-serif;font-size:16px}
a.home{color:#fff}
#askb{position:fixed;right:14px;bottom:14px;z-index:9;border:0;border-radius:999px;padding:12px 16px;font:inherit;background:var(--choc);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);cursor:pointer}
#ask{position:fixed;right:14px;bottom:70px;z-index:9;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#ask.hide{display:none}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><span class="stormy">🐱☁️</span>
<h1>Stormy's Revision Coach</h1>
<p>Semester 1 English · your teacher's booklet, page by page · ⭐ <span id="stars">0</span> stars</p></div></header>
<div class="wrap">
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('s1c_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('s1c_'+k,JSON.stringify(v))}catch(e){}}};
let done=store.get('done',{});
function star(id){if(!done[id]){done[id]=1;store.set('done',done)}$('#stars').textContent=Object.keys(done).length}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const norm=s=>s.replace(/[“”„]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim();
const low=s=>norm(s).toLowerCase().replace(/[.!?,"']/g,'').trim();
const sentences=s=>norm(s).split(/(?<=[.!?])\s+/).filter(x=>x.length);
/* rule checker for writing boxes. Each rule returns '' if ok, else a tip */
const RULES={
 cap:t=>/^["']?[A-Z]/.test(norm(t))?'':'Start with a CAPITAL letter.',
 stop:t=>/[.!?]["']?$/.test(norm(t))?'':'End with a full stop . ! or ?',
 caps:t=>{const bad=sentences(t).filter(x=>!/^["']?[A-Z]/.test(x));return bad.length?'Every new sentence needs a capital letter: "'+bad[0].slice(0,20)+'…"':''},
 i:t=>/(^|\s)i(\s|')/.test(norm(t))?'Little "i" on its own must be a capital I.':'',
 quote:t=>/".+"/.test(norm(t))?'':'Copy the exact words inside "speech marks".',
 because:t=>/because/i.test(t)?'':'Use "because" to give your reason.',
 shows:t=>/shows?|means|tells/i.test(t)?'':'Add "This shows that…" to explain.',
 ly:t=>/\b\w{3,}ly\b/i.test(t)?'':'Add an adverb – a HOW word, often ending in -ly.',
 simile:t=>/\blike\b|\bas \w+ as\b/i.test(t)?'':'Add a simile: "like a…" or "as … as a…".',
 q:t=>/\?/.test(t)?'':'Add one question (?).',
 ex:t=>/!/.test(t)?'':'Add one exclamation (!).',
 nosaid:t=>/\bsaid\b/i.test(t)?'Use a speech verb that is NOT "said" (shouted, cried, gasped…).':'',
 lines4:t=>t.split(/\n/).filter(x=>x.trim()).length>=4?'':'Write at least 4 lines – new speaker, new line.',
};
function ruleCheck(t,rules){const out=[];for(const r of rules){let m;
 if(m=r.match(/^no:(.+)$/)){if(new RegExp('\\b'+m[1]+'\\b','i').test(t))out.push('Do not use the word "'+m[1]+'". Show it instead!');continue}
 if(m=r.match(/^min:(\d+)$/)){if(norm(t).split(' ').length<+m[1])out.push('Write a bit more – at least '+m[1]+' words.');continue}
 if(m=r.match(/^sent:(\d+)$/)){const n=sentences(t).length;if(n!=+m[1])out.push('I count '+n+' sentence(s). The task wants '+m[1]+'. Each one ends with a full stop.');continue}
 if(m=r.match(/^short:(\d+)$/)){const l=sentences(t).filter(x=>x.split(' ').length>+m[1]);if(l.length)out.push('Make every sentence SHORT (≤'+m[1]+' words). "'+l[0]+'" is too long.');continue}
 if(m=r.match(/^sentmin:(\d+)$/)){if(sentences(t).length<+m[1])out.push('Write at least '+m[1]+' sentences.');continue}
 if(m=r.match(/^has:(.+)$/)){if(!new RegExp(m[1],'i').test(t))out.push(m[1].includes('|')?'Use one of: '+m[1].split('|').join(', '):'Include "'+m[1]+'".');continue}
 const f=RULES[r];if(f){const x=f(t);if(x)out.push(x)}}return out}

/* ---------- DATA: the teacher's booklet ----------
 q: question · help: what it really asks · hints: step clues · ex: SAME skill, DIFFERENT words
 type: check (ans list) | write (rules) | note (do on paper) · fix: Peter's own work to look at again */
const DAYS=[
{id:'d1',tab:'Mon',title:'Day 1 · Monday',pages:[
 {id:'p3',p:3,title:'Upgrade the writing',tip:'5 upgrades: short sentences · show, don\'t tell · interesting adjectives · powerful verbs & adverbs · similes & alliteration.',qs:[
  {n:1,q:'Mia was nervous. Show the feeling. Do NOT use "nervous".',help:'Show = what Mia\'s BODY does, what she SAYS or how she LOOKS.',hints:['Think: hands? knees? voice? breathing?','Use 2 actions: "Mia\'s … and she …"'],ex:'Tell: Leo was happy.  →  Show: Leo grinned and bounced on his toes.',type:'write',rules:['cap','stop','no:nervous','min:7'],fix:'You wrote "Mia was trembling" – great verb! Now add a body part and one more action, then a full stop.'},
  {n:2,q:'The old house was creepy. Do NOT use "creepy".',help:'Give 2 things you can SEE or HEAR that make it creepy.',hints:['See: cobwebs? broken windows? Hear: a door creaking?','You can start: "Cobwebs …" or "The old house …"'],ex:'The forest was scary.  →  Twisted branches clawed at the sky and an owl hooted.',type:'write',rules:['cap','stop','no:creepy','min:8'],fix:'You stopped after "The old house was". Finish it with 2 details.'},
  {n:3,q:'Ben was tired. Do NOT use "tired".',help:'Better word OR show it (yawning, eyes closing).',hints:['Spelling: ex-H-austed (there is a silent h!)','Name = capital B.'],ex:'Sam was hungry. → Sam\'s tummy growled and he stared at the cake.',type:'write',rules:['cap','stop','no:tired','min:4'],fix:'"ben was exausted" → capital B and spell exhausted with h.'},
  {n:4,q:'The dog ran. Add ONE adjective and ONE adverb.',help:'Adjective = describes the dog (before "dog"). Adverb = HOW it ran (after "ran"), often ends in -ly.',hints:['Adjective ideas: fluffy, enormous, excited, muddy','Adverb ideas: quickly, wildly, happily','Spelling: quick + ly = quickly'],ex:'The cat slept. → The lazy cat slept peacefully.',type:'write',rules:['cap','stop','ly'],fix:'"quicky" → quickly (quick + ly). "entertained" is a feeling about a show – pick a word that describes a dog.'},
  {n:5,q:'Rewrite as THREE short sentences to build tension.',help:'Chop the long sentence into 3 tiny pieces. Each piece ends with a full stop.',hints:['Piece 1: something suddenly happens.','Piece 2: the door had been shut for years.','Piece 3: what it did – creaked open slowly.'],ex:'The tall man, who had waited for hours, finally stood up. → The man waited. Hours passed. Finally, he stood up.',type:'write',rules:['sent:3','short:8','caps'],fix:'You copied it as ONE long sentence. The task wants THREE short ones.'},
  {n:6,q:'Write a more powerful verb: said → , went → , looked →',help:'A stronger word that shows HOW.',hints:['said: whispered, shouted, gasped','went: hurried, crept, dashed','looked: stared, peered, glared'],ex:'ate → gobbled',type:'note',fix:'Check spelling: whispered (wh-), hurried (y → i + ed).'},
  {n:7,q:'Upgrade the paragraph. Use at least THREE upgrades.',help:'The girl walked to the beach. It was hot. She was happy. She saw a big wave.',hints:['1 powerful verb instead of walked (skipped? strolled?)','Show "hot": the sand burned her feet…','Show "happy": she giggled / skipped…','A simile for the wave: "as tall as a …" or "like a …"'],ex:'The boy went to the park. It was cold. → The boy trudged to the park. Frost crunched under his boots like broken glass.',type:'write',rules:['caps','stop','simile','sentmin:3','no:happy'],fix:'", it was hot." → full stop + capital I: ". It was hot." Add a simile and SHOW happy.'}]},
 {id:'p4',p:4,title:'Find the evidence (Zara)',tip:'Point + Evidence "…" + Explain: I think… because the text says "…". This shows that…',qs:[
  {n:1,q:'Zara is nervous. Underline TWO pieces of evidence.',help:'Find what her BODY does and what her VOICE does.',hints:['One is about her hands.','One is about her voice.'],type:'note'},
  {n:2,q:'I think Zara is nervous because the text says "…". This shows that … (2 marks)',help:'Copy the EXACT words inside " ". Then explain something NEW – don\'t just say "nervous" again.',hints:['Copy exactly: "Zara\'s hands shook" or "her voice came out as a whisper".','This shows that she is afraid of … (the audience? going on stage?)'],ex:'"Ali\'s face went red and he looked at the floor." This shows that he feels embarrassed and wants to hide.',type:'write',rules:['quote','shows','no:nervous'],fix:'Your evidence was right! But "This shows that Zara was nervous" repeats the question. Explain WHY: what is she scared of?'}]},
 {id:'p5',p:5,title:'Word Detective',tip:'4 clues: read around · look inside (prefix/suffix) · swap it · check it.',qs:[
  {n:1,q:'Ferocious: copy the clue words, then tick.',help:'Copy the words around it that help you.',hints:['Which words describe the waves and the wind?'],type:'note',fix:'Your tick ✔ is right! Now copy the clue words on the line.'},
  {n:2,q:'What does famished mean? Write the clue words too.',help:'Meaning + the words that told you.',hints:['Spelling: h-u-n-g-r-y','Clue: how long had he not eaten? What did his stomach do?'],type:'write',rules:['has:hungry|starving','has:eaten|stomach|rumbled'],fix:'Meaning ✔. Add the clue words from the text.'},
  {n:3,q:'Prefixes: unlock, rewrite, disappear, misread',help:'un- = not / undo · re- = again · dis- = the opposite · mis- = wrongly',hints:['disappear = the opposite of appear. What is the opposite of appearing?'],type:'check',items:[['unlock =',['not lock','undo the lock','open','open the lock','opposite of lock','not locked','to open']],['rewrite =',['write again']],['disappear =',['not appear','opposite of appear','go away','vanish','go out of sight','not be seen','not appear anymore']],['misread =',['read wrongly','read wrong','read it wrong','read incorrectly']]],fix:'"disappear = finished" is not right. dis- means opposite.'}]},
]},
{id:'d2',tab:'Tue',title:'Day 2 · Tuesday',pages:[
 {id:'p6',p:6,title:'Spot the technique',tip:'Simile = what is compared + the picture it gives.',qs:[
  {n:1,q:'Copy the simile.',type:'note',fix:'✔ Spelling: sleepy (one p after slee).'},
  {n:2,q:'What does that simile help you imagine?',help:'How is fog LIKE a sleepy cat?',hints:['A sleepy cat is soft, slow and quiet.','"It helps me imagine the fog moving …"'],ex:'"The snow was like a white blanket" – it helps me imagine the snow is thick and covers everything softly.',type:'write',rules:['cap','stop','has:soft|slow|quiet|gentle|silent'],fix:'Say what the fog is LIKE (soft? slow? quiet?), not only that it crept.'},
  {n:3,q:'Why does the writer repeat "Nobody"?',type:'note',fix:'Good idea! Shorter: "To show how silent it is and build tension." Spell: emphasise.'},
  {n:4,q:'How does Jo feel? Give a reason.',type:'note',fix:'✔ Great reason. Spell: frightened (fright-en-ed).'},
  {n:5,q:'Reluctant',type:'note',fix:'✔ Correct!'}]},
 {id:'p7',p:7,title:'The Whistle in the Woods',tip:'Every 1-mark "why" answer: one clear idea + a word from the text.',qs:[
  {n:1,q:'Where does Arjun follow the path?',type:'note',fix:'✔ grandmother\'s needs the apostrophe (the farm belongs to her).'},
  {n:3,q:'Why does the writer repeat thud?',help:'What sound is "thud, thud, thud"? What does it do to the reader?',hints:['It is the sound of his heart.','It builds tension / shows he is scared.'],type:'write',rules:['cap','stop','has:heart|tension|scared|afraid|nervous'],fix:'Your answer is about the character. Say: it sounds like his heart beating and builds tension.'},
  {n:4,q:'Which word in Part 2 is an adverb?',help:'Adverb = HOW something is done. Many end in -ly.',hints:['"crouched" is a VERB (an action).','Read sentence 6 of Part 2. Find a -ly word.'],type:'check',items:[['Adverb:',['slowly']]],fix:'"crouched" is a verb, not an adverb.'},
  {n:5,q:'What does gulped tell you about how Arjun feels?',type:'note',fix:'"unsure" is OK. A stronger feeling word: nervous / scared.'},
  {n:6,q:'How can you tell the hut might not be empty? Use evidence.',help:'Find what shows someone is inside – copy it in " ".',hints:['What was the window doing?','Where did the whistle come from?'],type:'write',rules:['quote','because'],fix:'Use the words from Part 2 in " " (window, whistle). "Magical" is a guess – use evidence.'},
  {n:7,q:'Why end with "The door swung open before he touched it"?',help:'How does the reader feel at the end?',hints:['It is a mystery / cliffhanger.','It makes the reader want to read on.'],type:'write',rules:['cap','stop','has:mystery|read on|want to know|tension|cliffhanger|surprise'],fix:'Say the effect on the READER: makes us want to read on.'},
  {n:8,q:'Is Arjun brave? Tick, then give a detail.',type:'note',hints:['Detail: what does he do even though he is scared? (crept forward, pushed aside the ivy, reached for the handle)'],fix:'You ticked Yes – now write the detail!'}]},
 {id:'p9',p:9,title:'A Cold Night in London (questions)',tip:'Historical story: look for jobs, clothes, objects, places and how people talk.',qs:[
  {n:1,q:'Where and when?',type:'note',fix:'✔ London needs a capital L (it is a place name).'},
  {n:2,q:'Two details that show the past.',type:'note',fix:'✔ Great – lamplighter is a job from the past!'},
  {n:4,q:'Two adjectives that describe the setting.',help:'Setting = the place. Adjectives = describing words.',hints:['Look in paragraph 1 at the words before "brick wall".','And the words before "street".'],type:'check',items:[['Adjective 1:',['cold','narrow','cobbled','thin']],['Adjective 2:',['cold','narrow','cobbled']]],fix:'You left this blank. Find them in paragraph 1.'},
  {n:5,q:'Rewrite in Standard English: "Ain\'t got no father neither."',help:'Ain\'t → haven\'t · no → a · neither → either',hints:['Start with "I".'],type:'check',items:[['Standard English:',["i havent got a father either","i dont have a father either","i have not got a father either","i do not have a father either"]]],fix:'Close! Add "either" at the end and a capital I.'},
  {n:6,q:'Why did the lamplighter give Tom his scarf? Use evidence. (2 marks)',help:'2 marks = a point + evidence.',hints:['Point: he felt sorry for Tom / Tom was freezing.','Evidence: look at paragraph 5 (Tom\'s fingers) or how he spoke in paragraph 3.'],ex:'I think the girl shared her lunch because she was kind. The text says "she saw his empty lunchbox".',type:'write',rules:['cap','because','quote'],fix:'"be he was kind" – good point, but add the evidence in " " (bare, blue fingers).'},
  {n:7,q:'What happens next? Give a reason. (2 marks)',help:'A guess + a reason FROM THE TEXT.',hints:['Will Tom go? Think of his stomach and the hot soup.','I think … because the text says "…"'],type:'write',rules:['cap','stop','because'],fix:'Good! Use a clue from the text, e.g. his stomach "rumbled loudly" and there is "hot soup".'}]},
]},
{id:'d3',tab:'Wed',title:'Day 3 · Wednesday',pages:[
 {id:'p10',p:10,title:'Verbs and tenses',tip:'Past = finished · Present = now · Future = will. Irregular: go–went, see–saw, hide–hid, sleep–slept.',qs:[
  {n:1,q:'Rewrite with a MORE powerful verb.',help:'walked, said, ran → a word that shows HOW.',hints:['Sneaky walk? crept, tiptoed, sneaked','Angry said? snapped, shouted, growled','Fast ran? raced, dashed, sprinted'],type:'check',items:[['The thief ___ into the shop.',['crept','tiptoed','sneaked','snuck','slipped','stormed','burst','marched','strolled','stomped']],['"Go away!" the old man ___.',['shouted','snapped','yelled','growled','screamed','roared','bellowed','barked','cried','grumbled','shrieked','hissed']],['The children ___ down the street.',['raced','dashed','sprinted','rushed','zoomed','hurried','charged','bolted','scurried','galloped','skipped']]]},
  {n:2,q:'Complete the table (past / present / future).',help:'Future = will + verb. Careful with hide and sleep (irregular)!',hints:['shiver: add -ed for the past.','hid ← hide','will sleep → slept'],type:'check',items:[['Past of shiver:',['shivered']],['Future of shiver:',['will shiver']],['Present of hid:',['hide']],['Future of hid:',['will hide']],['Past of will sleep:',['slept']],['Present of will sleep:',['sleep']]]},
  {n:3,q:'Circle the correct word.',hints:['Yesterday → past','Tomorrow → future (will)'],type:'check',items:[['Yesterday, Tom ___ to the market.',['walked']],['Tomorrow, we ___ the museum.',['will visit']]]},
  {n:4,q:'Rewrite in the past tense.',help:'Tom hides under the bridge. He shivers and listens. Then he sees a light.',hints:['4 verbs to change: hides, shivers, listens, sees','hide → hid, see → saw (irregular!)'],type:'check',items:[['Past tense:',['tom hid under the bridge he shivered and listened then he saw a light']]]}]},
 {id:'p12',p:12,title:'Linh and the River (questions)',tip:'5 stages: Introduction → Problem → Climax → Resolution → Conclusion.',qs:[
  {n:1,q:'Where and when? Give evidence.',hints:['When: the first 2 words of the story.','Where: "in a small village beside …"'],type:'write',rules:['cap','quote']},
  {n:2,q:'Why did Linh sigh?',hints:['What did she carry every morning?'],type:'write',rules:['cap','stop','has:heavy|bucket']},
  {n:3,q:'Copy ONE word for how the villagers felt.',hints:['Paragraph 3, first sentence.'],type:'check',items:[['One word:',['terrified']]]},
  {n:4,q:'"water was creeping towards the houses" suggests…',hints:['Creeping = moving slowly. Towards the houses = getting closer.'],type:'note'},
  {n:5,q:'The heron\'s words in your OWN words. (2 marks)',help:'Do NOT copy. Say it a different way.',hints:['"Be kind to the river" = look after …','"the river will be kind to you" = it will …'],ex:'"Treat others well and they will treat you well" → If you are nice to people, they will be nice back.',type:'write',rules:['cap','stop','no:kind','min:8']},
  {n:6,q:'What message does the story teach? Use the last paragraph. (2 marks)',hints:['Find the words after "never forgot:"','Message + evidence in " ".'],type:'write',rules:['cap','quote']},
  {n:7,q:'Complete the story map.',hints:['1 Linh carries heavy water.','2 The heron speaks; the rain falls.','3 The flood! Linh scoops the mud.','4 Villagers dig a channel.','5 Clean water; the lesson.'],type:'note'}]},
]},
{id:'d4',tab:'Thu',title:'Day 4 · Thursday',pages:[
 {id:'p13',p:13,title:'Punctuating speech',tip:'"Spoken words," said Dad.  Punctuation goes INSIDE the speech marks. Capital letter to start the spoken words.',qs:[
  {n:1,q:'Rewrite with inverted commas and the correct punctuation.',help:'Find the EXACT words the person says. Put " " around them.',hints:['Speech first → comma inside: "…," said Dad.','Question → ? inside, then asked (small a).','Speech second → Linh whispered, "I …"','Split speech: "…," said the heron, "the water …"'],type:'check',sp:1,items:[['come and look at this said Dad',['"come and look at this," said dad']],['where are you going asked Mum',['"where are you going?" asked mum']],['I love the sea shouted Ben',['"i love the sea!" shouted ben','"i love the sea," shouted ben']],['Linh whispered I think the river is rising',['linh whispered, "i think the river is rising."']],['be careful said the heron the water is deep',['"be careful," said the heron, "the water is deep."','"be careful," said the heron. "the water is deep."']]]}]},

function warmHTML(did){const w=WARM[did];if(!w)return'';const id='w_'+did;
 return `<div class="card" style="border:3px solid var(--mint)"><h3>🔥 Step 1 · Warm-up words (${w.words.length})</h3>
 <p class="small">Tap 🔊, say the word 3 times, read the example. Tap 🇻🇳 if you need help.</p>
 ${w.words.map((x,k)=>`<div class="q" style="padding:8px 0"><span style="font-size:30px">${x[1]}</span> <b style="font-size:21px">${x[0]}</b> <button class="s" onclick="say('${x[0].replace(/'/g,"\\'")}. ${x[4].replace(/'/g,"\\'").replace(/"/g,'')}')">🔊</button> <button class="s" onclick="tog('${id}v${k}')">🇻🇳</button><div>= ${esc(x[2])}</div><div class="small"><i>${esc(x[4])}</i></div><div class="box hint vi hide" id="${id}v${k}">${esc(x[3])}</div></div>`).join('')}
 <h3>🎯 Word match</h3><p class="small">Tap a word, then tap its meaning.</p><div id="${id}_m"></div></div>
 <div class="card" style="border:3px solid var(--gold)"><h3>🧠 Step 2 · How to do it: ${w.how.name}</h3>
 <div class="box hint vi">🇻🇳 ${esc(w.how.vi)}</div>
 <p><b>👩‍🏫 I do (watch me):</b></p><ol>${w.how.ido.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
 <p><b>🤝 We do:</b> ${esc(w.how.wedo.q)}</p>${w.how.wedo.c.map((c,k)=>`<span class="chip" onclick="wedo(this,'${did}',${k})">${esc(c)}</span>`).join('')}<div id="${id}_wd"></div>
 <p><b>🙋 You do:</b> now open your booklet and try the pages below ⬇️</p></div><h3>📚 Step 3 · Your teacher's pages</h3>`}
function wedo(el,did,k){const w=WARM[did].how.wedo;const ok=k==w.a;el.classList.add('sel');$('#w_'+did+'_wd').innerHTML=`<div class="box ${ok?'ok':'no'}">${ok?'✅ Yes! '+esc(w.why):'🙈 Not quite – try again.'}</div>`;if(ok)star('wedo_'+did)}
let mSel={};
function matchGame(did){const w=WARM[did];if(!w)return;const el=$('#w_'+did+'_m');if(!el)return;
 const words=w.words.map((x,k)=>k);const means=[...words].sort(()=>Math.random()-.5);
 el.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:140px">${words.map(k=>`<span class="chip" id="mw_${did}_${k}" onclick="mPick('${did}','w',${k})">${w.words[k][1]} ${w.words[k][0]}</span>`).join('<br>')}</div><div style="flex:2;min-width:200px">${means.map(k=>`<span class="chip" id="mm_${did}_${k}" onclick="mPick('${did}','m',${k})">${esc(w.words[k][2])}</span>`).join('<br>')}</div></div><div id="mr_${did}"></div>`;mSel[did]={n:0}}
function mPick(did,side,k){const s=mSel[did];const el=$(`#m${side}_${did}_${k}`);if(el.dataset.done)return;
 if(side=='w'){document.querySelectorAll(`[id^=mw_${did}_]`).forEach(e=>{if(!e.dataset.done)e.classList.remove('sel')});el.classList.add('sel');s.w=k;return}
 if(s.w==null){$('#mr_'+did).innerHTML='<div class="box hint">Tap a word first 👈</div>';return}
 if(s.w==k){[el,$(`#mw_${did}_${k}`)].forEach(e=>{e.dataset.done=1;e.classList.add('sel');e.style.opacity=.55});s.n++;s.w=null;say(WARM[did].words[k][0]);
  $('#mr_'+did).innerHTML=s.n==WARM[did].words.length?'<div class="box ok">🌟 All matched! You are ready.</div>':'<div class="box ok">✅ '+s.n+' matched</div>';if(s.n==WARM[did].words.length)star('match_'+did)}

let fs=store.get('fs',{});
function fsSave(){store.set('fs',fs)}
function fsPara(st){if(st.text){const s={};(st.pick||[]).forEach(([k,,o])=>s[k]=fs[k]||null);if((st.pick||[]).some(([k])=>!fs[k]))return '';return st.text(s)}
 const i=fs[st.k];return i==null?'':st.opts[i][1]}
function fsStory(){return FS.steps.map(fsPara)}
function fsWc(s){return (s.match(/[A-Za-z']+/g)||[]).length}
function fixstory(){
 const bugsDone=FS.bugs.filter((b,i)=>fs['b'+i]===b[2]).length;
 let h=`<h2>✏️ Fix My Story · page 15–16</h2>
 <div class="card"><b>The Night the Lights Went Out</b> · 120–180 words · 4–5 paragraphs<br>
 <span class="small">You already wrote a great story! Now we make it SHINE. You only tap – no typing. At the end you copy it on paper.<br><span class="vi">Con không cần gõ. Chỉ bấm chọn, đọc lý do, cuối cùng chép bài vào giấy.</span></span></div>
 <div class="card"><h3>⭐ Two stars first!</h3>
 <div class="box ok">⭐ Super strong words: <b>hammering, howled, glowing eyes staring, soaking wet, hurried, rusty wooden shed, ancient jacket</b>.</div>
 <div class="box ok">⭐ Your story has a beginning, a problem and an ending – and the otter is a lovely surprise!</div>
 <div class="box hint">🌱 One wish: some sentences are too long. We cut them into shorter ones.</div></div>
 <div class="card"><h3>🐞 Step 1 · Bug hunt (${bugsDone}/${FS.bugs.length})</h3><p class="small">Tap the right word. Read why.</p>`;
 FS.bugs.forEach((b,i)=>{const a=fs['b'+i];
  h+=`<div class="q">${esc(b[0]).replace('___','<b>___</b>')}<div class="btns">${b[1].map((w,j)=>`<button class="s ${a===j?(j===b[2]?'go':''):''}" onclick="fsBug(${i},${j})">${esc(w)}</button>`).join('')}</div>${a==null?'':a===b[2]?`<div class="box ok">✅ ${esc(b[3])}</div>`:`<div class="box no">Try again! 🤔</div>`}</div>`});
 h+='</div>';
 FS.steps.forEach((st,n)=>{const p=fsPara(st);
  h+=`<div class="card"><h3>Step ${n+2} · ${esc(st.t)}</h3>
  <div class="box fix"><b>You wrote:</b> ${esc(st.orig)}</div>
  <b>Why change? 🤔</b>${st.why.map(([e,v])=>`<div class="box hint">• ${esc(e)}<br><span class="vi">${esc(v)}</span></div>`).join('')}`;
  if(st.opts)h+=`<b>Choose one:</b>`+st.opts.map(([l,t],i)=>{const off=st.k=='p5'&&i==2&&fs.p4===1;return `<div class="box ${fs[st.k]===i?'ok':'ex'}" style="cursor:pointer;opacity:${off?.4:1}" onclick="${off?'':`fsPick('${st.k}',${i})`}"><b>${esc(l)}</b><br>${esc(t)}</div>`}).join('');
  (st.pick||[]).forEach(([k,q,o])=>{h+=`<div><b>${esc(q)}</b><br>${o.map(w=>`<span class="chip ${fs[k]===w?'sel':''}" onclick="fsPick('${k}','${w.replace(/'/g,"\\'")}')">${esc(w)}</span>`).join('')}</div>`});
  if(p&&st.text)h+=`<div class="box ok"><b>New paragraph:</b><br>${esc(p)}</div>`;
  if(p)h+=`<button class="s" onclick="say(fsStory()[${n}])">🔊 Listen</button>`;
  h+=`<div class="q"><b>✏️ Write it yourself</b> <span class="small">(new paragraph in your own words – Stormy checks, then shows the correct answer)</span><br><span class="vi">Con tự viết lại đoạn này, bấm Check để xem đúng/sai, nhận xét và đáp án.</span><textarea id="fsw_${st.k}">${esc(fs['w'+st.k]||'')}</textarea><button class="s go" onclick="fsCheck(${n})">✅ Check</button><div id="fsr_${st.k}"></div></div>`;
  h+='</div>'});
 const s=fsStory(),all=s.every(Boolean),full=s.join(' '),w=fsWc(full);
 h+=`<div class="card"><h3>🏆 Step 7 · Your finished story</h3>`;
 if(!all)h+=`<p>Finish Steps 2–6 to see your whole story. (${s.filter(Boolean).length}/5 paragraphs)</p>`;
 else{
  const chk=[['Short sentences for tension','"Nothing." "Locked."'],['Strange thing with interesting words','"two glowing eyes stared at him"'],['Ending links back or surprises',fs.p5==1?'Surprise: four glowing eyes!':'Back with Grandma'],['Setting and character are clear','"Grandma\'s old house… stormy Saturday night"'],['Showed feeling, not told','"'+fs.feel+'"'],['At least one simile','"'+fs.sim+'"'],['Capital letters, full stops, spelling','Bug hunt done ✅'],['Word count 120–180',w+' words']];
  h+=`<p class="small">Title on paper: <b>The Night the Lights Went Out</b></p>`+s.map((p,i)=>`<p style="text-indent:1.5em;margin:8px 0">${esc(p)}</p>`).join('')+
  `<button class="s go" onclick="say(fsStory().join(' '))">🔊 Read my whole story</button>
  <h3 style="margin-top:14px">✅ Teacher's checklist</h3>`+chk.map(([a,b])=>`<div class="box ok">✔ <b>${esc(a)}</b> – ${esc(b)}</div>`).join('')+
  `<h3>📝 Copy it on paper</h3><div class="box hint">• One paragraph at a time. Tap ✔ when it is copied.<br>• New paragraph = new line + small space at the start.<br>• Check: Capital ✔ Full stop ✔ Finger space ✔<br><span class="vi">Mỗi lần chép 1 đoạn, nghỉ 1 phút rồi chép tiếp. Không cần vội.</span></div>`+
  s.map((p,i)=>`<span class="chip ${fs['c'+i]?'sel':''}" onclick="fsPick('c${i}',${fs['c'+i]?0:1})">${fs['c'+i]?'✔':'☐'} Paragraph ${i+1}</span>`).join('');
  if(s.every((p,i)=>fs['c'+i])){h+='<div class="box ok">🎉 Whole story copied! Show it to Mum. Stormy is so proud of you!</div>';star('fix_story')}
 }
 h+='</div>';
 $('#view').innerHTML=h}
const FSNEED={p1:[/\b(storm|stormy|rain|wind|thunder|night)\b/i,'Say the weather or time (storm, rain, night…) so the setting is clear.','Thêm thời tiết/thời gian để bối cảnh rõ.'],
 p2:[/\b(heart|hands?|breath|knees|shiver|trembl|froze|goosebumps)/i,'Show a feeling with the body (heart thumped, hands trembled…).','Tả cảm xúc qua cơ thể.'],
 p3:[/\blike\b|\bas \w+ as\b/i,'Add a simile with "like" or "as … as".','Cần 1 phép so sánh: like / as…as.'],
 p4:[/\b(so|because|to)\b/i,'Give a reason: why did Peter do it? (so / because)','Nói lý do: vì sao Peter làm vậy.'],
 p5:[/grandma|!/i,'Link back to Grandma, or end with a surprise!','Quay lại bà, hoặc kết bất ngờ.']};
function fsCheck(n){const st=FS.steps[n],k=st.k,t=document.getElementById('fsw_'+k).value.trim();fs['w'+k]=t;fsSave();if(!t)return;
 const good=[],fix=[];const sents=t.split(/(?<=[.!?])\s+/).filter(Boolean);
 if(sents.every(s=>/^["']?[A-Z]/.test(s)))good.push(['Every sentence starts with a capital letter.','Đầu câu viết hoa đúng.']);else fix.push(['Start every sentence with a CAPITAL letter.','Đầu mỗi câu phải viết hoa.']);
 if(/[.!?]["']?$/.test(t))good.push(['It ends with a full stop.','Có dấu chấm cuối.']);else fix.push(['Put a full stop (or !) at the end.','Thiếu dấu chấm cuối câu.']);
 if(/\bi\b/.test(t))fix.push(['"I" is always a capital letter.','Chữ "I" luôn viết hoa.']);
 if(/[a-z] (When|But|And|So|He|She|It|The)\b/.test(t))fix.push(['A capital letter in the middle of a sentence? Only names get capitals there.','Không viết hoa giữa câu (trừ tên riêng).']);
 const w=(t.match(/\bwhen\b/gi)||[]).length;if(w>1)fix.push([`"when" is used ${w} times. Make new sentences: Suddenly / Slowly / Just then.`,'Lặp "when" → tách câu mới.']);
 if(/,\s*(he|she|it|they|peter|when)\b/i.test(t))fix.push(['A comma cannot join two sentences – use a full stop.','Dấu phẩy không nối 2 câu → dùng dấu chấm.']);
 const bad=t.match(/\b(he|she|peter|it|they|and)\s+(open|check|escape|come|explore|look|hurry|run|take|see|walk|push|hear|grab|climb|let go)\b/gi);
 if(bad)fix.push([`Past tense! "${bad[0]}" → the story already happened (opened, checked, came, saw, took…).`,'Dùng thì quá khứ: thêm -ed hoặc từ đặc biệt.']);
 if(/\btouch\b/i.test(t))fix.push(['"touch" → "torch" (the light 🔦).','Đèn pin là "torch".']);
 if(sents.some(s=>s.split(/\s+/).length>25))fix.push(['One sentence is very long. Cut it into 2 shorter ones.','Câu quá dài → cắt đôi.']);
 if(n==1){if(sents.some(s=>s.split(/\s+/).length<=3))good.push(['Short sentence for tension! ⚡','Có câu ngắn tạo hồi hộp.']);else fix.push(['Add a very short sentence for tension: "Nothing." "Locked."','Thêm câu thật ngắn để hồi hộp.'])}
 const nd=FSNEED[k];if(nd[0].test(t))good.push([nd[1].replace(/^(Say|Show|Add|Give|Link)/,'✓ $1').split(/[.(]/)[0]+' – done!','Đạt yêu cầu đoạn này.']);else fix.push([nd[1],nd[2]]);
 const model=fsPara(st)||(st.opts?st.opts[0][1]:st.text({sound:'scratching',feel:'His heart thumped.',sim:'like two tiny torches'}));
 const ok=!fix.length;if(ok)star('fsw_'+k);
 document.getElementById('fsr_'+k).innerHTML=`<div class="box ${ok?'ok':'no'}"><b>${ok?'✅ Correct! Great job!':'🔧 Almost! Fix '+fix.length+' thing'+(fix.length>1?'s':'')+':'}</b></div>`+
  good.map(([e,v])=>`<div class="box ok">⭐ ${esc(e)} <span class="vi">· ${esc(v)}</span></div>`).join('')+
  fix.map(([e,v])=>`<div class="box no">🔧 ${esc(e)}<br><span class="vi">${esc(v)}</span></div>`).join('')+
  `<div class="box ex"><b>📗 Correct answer (model):</b><br>${esc(model)}</div><button class="s" onclick="say(${JSON.stringify(model).replace(/"/g,'&quot;')})">🔊 Listen to the model</button>`}
function fsBug(i,j){fs['b'+i]=j;fsSave();const y=scrollY;fixstory();scrollTo(0,y);if(j===FS.bugs[i][2])star('fsb'+i)}
function fsPick(k,v){fs[k]=v;if(k=='p4'&&v===1&&fs.p5===2)delete fs.p5;fsSave();const y=scrollY;fixstory();scrollTo(0,y)}

/* ---------- Ask Stormy helper ---------- */
const ASK=[
 [['simile'],'A simile compares two things with "like" or "as". Example: "eyes like two tiny torches".','So sánh bằng "like" hoặc "as": mắt sáng NHƯ hai chiếc đèn pin.'],
 [['short sentence','short','tension'],'Short sentences make the reader hold their breath. "Nothing." "Locked." Use them at the scary part.','Câu ngắn làm người đọc hồi hộp. Dùng ở chỗ đáng sợ nhất.'],
 [['past','tense','-ed'],'The story already happened, so verbs are in the past: open → opened, come → came.','Truyện đã xảy ra → động từ ở quá khứ: thêm -ed, hoặc từ đặc biệt: come → came.'],
 [['show','tell','feeling','feel'],'Telling: "He was scared." Showing: "His hands trembled." Show what the BODY does.','KỂ: "Cậu ấy sợ". TẢ: "Tay cậu run lên". Tả cơ thể để người đọc tự đoán.'],
 [['when'],'Using "when" again and again makes one long, tiring sentence. Start new sentences with: Suddenly, Slowly, Just then, Moments later.','Lặp "when" làm câu quá dài. Thay bằng câu mới: Suddenly, Slowly, Just then.'],
 [['paragraph'],'A paragraph is a group of sentences about one idea. New idea = new paragraph = new line.','Đoạn văn = nhóm câu về 1 ý. Ý mới → xuống dòng.'],
 [['how many words','words','word count','long'],'Your story needs 120–180 words and 4–5 paragraphs.','Bài cần 120–180 từ, 4–5 đoạn.'],
 [['torch','touch'],'A torch is a small light you hold 🔦. Touch means to feel with your hand ✋.','Torch = đèn pin. Touch = chạm.'],
 [['musty'],'Musty = smells old and damp, like an old cupboard.','Musty = mùi ẩm mốc.'],
 [['otter'],'An otter is a small furry animal that lives near rivers and loves swimming 🦦.','Rái cá – sống gần sông, rất thích bơi.'],
 [['ancient'],'Ancient = very, very old.','Ancient = rất cũ, cổ xưa.'],
 [['ending','end','link back','surprise'],'A good ending goes back to the start (Grandma!) or gives a surprise (four eyes!).','Kết hay: quay lại mở bài (bà) hoặc tạo bất ngờ.'],
 [['setting'],'The setting is WHEN and WHERE: a stormy night at Grandma\'s old house.','Bối cảnh = khi nào + ở đâu.'],
 [['character'],'Character = who the story is about. What Peter DOES shows what he is like – helping the otter shows he is kind.','Nhân vật. Việc Peter làm cho thấy tính cách: cứu rái cá = tốt bụng.'],
 [['capital'],'Capital letters: start of a sentence, names (Peter, Grandma), and "I".','Chữ hoa: đầu câu, tên riêng, chữ "I".'],
 [['full stop','stop','comma'],'A full stop ends a sentence. A comma cannot join two sentences – use a full stop.','Dấu chấm kết thúc câu. Không dùng dấu phẩy để nối 2 câu.'],
 [['hammering'],'Hammering = hitting hard again and again, like a hammer 🔨.','Đập mạnh liên tục như búa.'],
 [['howled'],'Howled = made a long, loud crying sound, like a wolf 🐺.','Hú lên như sói.'],
 [['crept','creep'],'Crept = walked slowly and quietly so no one hears.','Rón rén đi.'],
 [['slammed','slam'],'Slammed = shut very hard with a BANG.','Đóng sầm.'],
 [['shivering','shiver'],'Shivering = shaking because you are cold.','Run vì lạnh.'],
 [['gently'],'Gently = softly and carefully.','Nhẹ nhàng.'],
 [['whispered'],'Whispered = said very quietly.','Thì thầm.'],
 [['glowing'],'Glowing = giving out a soft light.','Phát sáng.'],
 [['thumped'],'Thumped = beat hard. "His heart thumped" = his heart beat fast because he was scared.','Đập thình thịch.'],
 [['trembled'],'Trembled = shook a little because of fear.','Run rẩy.'],
 [['soaking','wet'],'Soaking wet = very, very wet.','Ướt sũng.'],
 [['dusty'],'Dusty = covered in dust (old dirt).','Đầy bụi.'],
 [['why','change','fix'],'We change things so your story is clear, exciting, and ticks every box on the teacher\'s checklist.','Sửa để bài rõ ràng, hấp dẫn và đủ mọi tiêu chí của cô.']];
function askAns(q){q=' '+q.toLowerCase()+' ';let best=null;for(const a of ASK)if(a[0].some(k=>q.includes(k))){best=a;break}
 return best?`<div class="box ok">🐱 ${esc(best[1])}<br><span class="vi">${esc(best[2])}</span></div>`:`<div class="box hint">🐱 Hmm, I don't know that one yet. Try a key word like "simile", "past tense", "torch" – or ask Mum!<br><span class="vi">Stormy chưa biết câu này. Thử gõ 1 từ khoá, hoặc hỏi mẹ nhé.</span></div>`}
function askUI(){if($('#ask'))return;const d=document.createElement('div');d.innerHTML=`<button id="askb" onclick="$('#ask').classList.toggle('hide')">🐱 Ask Stormy</button>
<div id="ask" class="hide"><div style="display:flex;justify-content:space-between"><b>🐱 Ask Stormy</b><button class="s" onclick="$('#ask').classList.add('hide')">✖</button></div>
<p class="small">Tap a question, or type a word you don't understand.</p>
<div>${['What is a simile?','Why short sentences?','What is past tense?','Show, not tell?','Why not "when"?','What is a paragraph?','How many words?','What is an otter?'].map(q=>`<span class="chip" onclick="askGo('${q.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">${esc(q)}</span>`).join('')}</div>
<div style="display:flex;gap:6px;margin-top:6px"><input type="text" id="askq" placeholder="e.g. crept" onkeydown="if(event.key=='Enter')askGo(this.value)"><button class="s go" onclick="askGo($('#askq').value)">Ask</button></div><div id="aska"></div></div>`;document.body.appendChild(d)}
function askGo(q){if(!q.trim())return;$('#aska').innerHTML=`<p class="small">You asked: ${esc(q)}</p>`+askAns(q);const t=$('#aska').innerText;say(t.split('\n')[1]||'')}

/* ---------- render ---------- */
let cur=store.get('tab','tonight');
function tabs(){const t=[['tonight','🌙 Start here'],['tiny','🧱 Tiny Steps'],['ladder','🪜 Writing Ladder'],['fix','✏️ Fix My Story'],...DAYS.map(d=>[d.id,d.tab]),['drills','🎯 Drills'],['parents','👨‍👩‍👦 Bố mẹ']];
 $('#tabs').innerHTML=t.map(([id,l])=>`<button class="tab ${cur==id?'on':''}" onclick="go('${id}')">${l}</button>`).join('')}
function go(id){cur=id;store.set('tab',id);tabs();render();scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function render(){
 if(cur=='tonight')return tonight();
 if(cur=='drills')return drills();
 if(cur=='ladder')return ladder();
 if(cur=='tiny')return tiny();
 if(cur=='fix')return fixstory();
 if(cur=='parents')return parents();
 const d=DAYS.find(x=>x.id==cur);
 $('#view').innerHTML=`<h2>${d.title}</h2><p class="small">Open your booklet at the same page. Read the question in the booklet, then use Stormy's help here. Write your final answer in the booklet.</p>`+warmHTML(d.id)+d.pages.map(pageHTML).join('');matchGame(d.id);
}
function pageHTML(p){
 return `<div class="card"><div class="pg" onclick="this.nextElementSibling.classList.toggle('hide')"><h3>📄 Page ${p.p} · ${p.title}</h3><span class="badge">${p.qs.length} Qs</span></div>
 <div><div class="box ex">💡 ${p.tip}</div>${p.qs.map((q,i)=>qHTML(p,q,i)).join('')}</div></div>`}
function qHTML(p,q,i){const id=p.id+'_'+i;let h=`<div class="q" id="${id}"><span class="qn">${q.n}</span><span class="qt">${esc(q.q)}</span> ${done[id]?'<span class="star">⭐</span>':''}
 <div class="btns"><button class="s" onclick="say(${esc(JSON.stringify(q.q+'. '+(q.help||'')))})">🔊 Read it</button>`;
 if(q.hints)h+=`<button class="s" onclick="hint('${id}')">💡 Hint</button>`;
 if(q.ex)h+=`<button class="s" onclick="tog('${id}_ex')">👀 Example (different words)</button>`;
 if(q.fix)h+=`<button class="s" onclick="tog('${id}_fix')">🔧 Look again at my work</button>`;
 h+=`</div>`;
 if(q.help)h+=`<div class="help">👉 ${esc(q.help)}</div>`;
 h+=`<div id="${id}_h"></div>`;
 if(q.ex)h+=`<div class="box ex hide" id="${id}_ex">👀 ${esc(q.ex)}</div>`;
 if(q.fix)h+=`<div class="box fix hide" id="${id}_fix">🔧 ${esc(q.fix)}</div>`;
 if(q.type=='check')h+=q.items.map((it,k)=>`<div style="margin:8px 0"><div>${esc(it[0])}</div><input type="text" id="${id}_i${k}" autocomplete="off" autocapitalize="off" spellcheck="false"><div id="${id}_r${k}"></div></div>`).join('')+`<button class="s go" onclick="check('${p.id}',${i})">✅ Check</button>`;
 if(q.type=='write'){const k=id+'_w';h+=`<textarea id="${k}" style="min-height:${q.big==2?260:q.big?140:70}px" oninput="${q.story?`wc('${id}')`:''};save('${k}')">${esc(store.get(k,''))}</textarea>${q.story?`<div class="small" id="${id}_wc"></div>`:''}<button class="s go" onclick="wcheck('${p.id}',${i})">🐱 Stormy, check my writing</button><div id="${id}_r"></div>`}
 if(q.type=='note')h+=`<button class="s" onclick="star('${id}');this.textContent='⭐ Done in my booklet!'">✍️ I did it in my booklet</button>`;
 if(q.type=='sort')h+=sortHTML(id,q);
 if(q.type=='timer')h+=`<div style="font-size:42px" id="tm">60:00</div><button class="s go" onclick="timer()">▶️ Start 60 minutes</button>`;
 return h+'</div>'}
function tog(id){$('#'+id).classList.toggle('hide')}
const hintN={};
function hint(id){const [pid,i]=id.split('_');const q=findQ(pid,+i);hintN[id]=(hintN[id]||0);if(hintN[id]<q.hints.length){$('#'+id+'_h').insertAdjacentHTML('beforeend',`<div class="box hint">💡 Hint ${hintN[id]+1}: ${esc(q.hints[hintN[id]])}</div>`);hintN[id]++}}
function findQ(pid,i){for(const d of DAYS)for(const p of d.pages)if(p.id==pid)return p.qs[i]}
function save(k){store.set(k,$('#'+k).value)}
function check(pid,i){const q=findQ(pid,i),id=pid+'_'+i;let all=true;
 q.items.forEach((it,k)=>{const v=$('#'+id+'_i'+k).value;const r=$('#'+id+'_r'+k);
  if(!v.trim()){r.innerHTML='';all=false;return}
  const ok=it[1].some(a=>q.sp?norm(v).toLowerCase().replace(/\.$/,'')==norm(a).toLowerCase().replace(/\.$/,''):low(v)==low(a));
  let extra='';
  if(q.sp&&ok&&!/^["']?[A-Z]/.test(norm(v)))extra=' (Remember: capital letter at the start!)';
  if(ok)r.innerHTML=`<div class="box ok">✅ Yes!${extra}</div>`;
  else{all=false;r.innerHTML=`<div class="box no">🙈 Not yet. ${q.sp?speechTip(v):'Try a hint 💡 and look at the text again.'}</div>`}});
 if(all){star(id);say('Brilliant! Now write it in your booklet.')}}
function speechTip(v){v=norm(v);if(!/"/.test(v))return'Add speech marks " " around the spoken words.';
 if(/"[^"]*"\s*[a-z]/.test(v)&&!/[,!?]"/.test(v))return'Punctuation (, ? !) goes INSIDE the closing speech mark.';
 if(/[.]"\s*(said|asked|shouted|cried|whispered)/i.test(v))return'Before "said", use a comma, not a full stop.';
 if(/"\s*(Said|Asked|Shouted|Cried|Whispered)/.test(v))return'"said / asked" needs a small letter.';
 if(/(said|whispered|shouted)\s"/i.test(v))return'Put a comma before the speech marks: said, "…';
 return'Check: speech marks, capital letter, punctuation inside.'}
function wcheck(pid,i){const q=findQ(pid,i),id=pid+'_'+i,t=$('#'+id+'_w').value;const r=$('#'+id+'_r');
 if(!t.trim()){r.innerHTML='<div class="box hint">Write something first 🙂</div>';return}
 const tips=ruleCheck(t,q.rules);
 if(!tips.length){r.innerHTML='<div class="box ok">🌟 Stormy is purring! It ticks every box. Copy it neatly into your booklet.</div>';star(id);say('Purr! Great work.')}
 else r.innerHTML=`<div class="box no">🐱 ${tips.length==1?'One':'A few'} thing${tips.length>1?'s':''} to fix:<br>• ${tips.map(esc).join('<br>• ')}</div>`}
function wc(id){const t=$('#'+id+'_w').value;const n=t.trim()?t.trim().split(/\s+/).length:0;const pa=t.split(/\n\s*\n|\n/).filter(x=>x.trim()).length;
 $('#'+id+'_wc').innerHTML=`Words: <b>${n}</b> (aim 120–180) · Paragraphs: <b>${pa}</b> (aim 4–5) ${n>=120&&n<=180?'✅':''}`}
function sortHTML(id,q){const opts=['simile','personification','alliteration','onomatopoeia'];
 return q.items.map((it,k)=>`<div style="margin:8px 0"><i>"${esc(it[0])}"</i><br>${opts.map(o=>`<span class="chip" onclick="pick(this,'${id}',${k},'${o}','${it[1]}')">${o}</span>`).join('')}<span id="${id}_s${k}"></span></div>`).join('')}
function pick(el,id,k,o,a){[...el.parentNode.querySelectorAll('.chip')].forEach(c=>c.classList.remove('sel'));el.classList.add('sel');$('#'+id+'_s'+k).textContent=o==a?' ✅':' 🙈';if(o==a)star(id+'_'+k)}
let tmI;function timer(){clearInterval(tmI);let s=3600;tmI=setInterval(()=>{s--;$('#tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s==1800)say('Thirty minutes. Time to start the writing section.');if(s<=0){clearInterval(tmI);say('Time is up! Pens down.')}},1000)}

function drills(){let h='<h2>🎯 Drills from your own work</h2>';
 const a=DRILLS[0];h+=`<div class="card"><h3>${a.title}</h3><p class="help">${a.help}</p>${a.words.map(([w,y],k)=>`<span class="chip" onclick="adv(this,${y},${k})">${w}</span>`).join('')}<div id="advr"></div></div>`;
 const c=DRILLS[1];h+=`<div class="card"><h3>${c.title}</h3><p class="help">${c.help}</p>${c.items.map(([w,a],k)=>`<div style="margin:8px 0"><i>${w}</i><input type="text" id="cap${k}" autocomplete="off"><div id="capr${k}"></div></div>`).join('')}<button class="s go" onclick="capc()">✅ Check</button></div>`;
 const s=DRILLS[2];h+=`<div class="card"><h3>${s.title}</h3><p class="help">${s.help}</p>${s.words.map((w,k)=>`<div style="display:flex;gap:6px;align-items:center;margin:6px 0"><button class="s" onclick="say('${w.replace("'","\\'")}')">🔊 ${k+1}</button><input type="text" id="sp${k}" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="spr${k}" style="min-width:110px"></span></div>`).join('')}<button class="s go" onclick="spc()">✅ Check</button></div>`;
 $('#view').innerHTML=h}
let advs={};function adv(el,y,k){el.classList.add('sel');advs[k]=y;el.textContent+=y?' ✅':' 🙈';const n=Object.values(advs).filter(Boolean).length;$('#advr').innerHTML=`<div class="box ${y?'ok':'no'}">${y?'Yes – it tells HOW!':'That one is not an adverb. Is it an action (verb) or a describing word (adjective)?'} (${n}/6 found)</div>`;if(n==6)star('drill_adv')}
function capc(){let all=1;DRILLS[1].items.forEach(([w,a],k)=>{const v=norm($('#cap'+k).value);const ok=v==a;if(!ok)all=0;$('#capr'+k).innerHTML=v?`<div class="box ${ok?'ok':'no'}">${ok?'✅':'🙈 '+(RULES.caps(v)||RULES.stop(v)||'Check names and the word I.')}</div>`:''});if(all)star('drill_cap')}
function spc(){let n=0;DRILLS[2].words.forEach((w,k)=>{const v=norm($('#sp'+k).value).replace(/’/g,"'");if(!v)return;const ok=v.toLowerCase()==w;if(ok)n++;$('#spr'+k).innerHTML=ok?'✅':'🙈 '+w});if(n==DRILLS[2].words.length)star('drill_spell')}
