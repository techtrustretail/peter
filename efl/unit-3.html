<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Sea Power Mission</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: a sea chart — one column of islands; each island opens a full-width mission card with big tap targets */
:root{
  --deep:#0a2f45; --sea:#0d5c7d; --foam:#eef7f6; --sand:#f7e9cc; --coral:#ff6b57; --kelp:#1e9c8c; --sun:#ffc23d;
  --ink:#13323f; --muted:#5a7682; --card:#ffffff; --line:#cfe3e4; --ok:#1d9a52; --okbg:#e3f6ea; --bad:#cf3f3f; --badbg:#fdeaea;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--foam);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.hero{background:linear-gradient(180deg,var(--deep),var(--sea));color:#fff;position:relative;overflow:hidden}
.hero .wrap{padding-block:22px 64px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h1{font-size:clamp(34px,7vw,52px);letter-spacing:.5px}
.hero p{margin:4px 0 0;color:#cfeaf0;font-size:16px}
.pearls{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:22px;white-space:nowrap}
.hero svg{position:absolute;left:0;bottom:-1px;width:100%;height:44px;display:block}
.topbar{display:flex;align-items:center;gap:12px;padding-block:14px}
.back{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:700}
.crumb{color:var(--muted);font-size:15px}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:-34px;position:relative}
.goal{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 6px 20px rgba(10,47,69,.12);min-width:0}
.goal b{font-family:var(--display);font-size:20px;display:block}
.goal small{color:var(--muted);font-size:13px;display:block}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 4px;position:relative}
.bar i{display:block;height:100%;background:var(--kelp);border-radius:9px}
.bar em{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--coral)}
.section-h{margin:28px 0 10px;font-size:26px}
.sub{color:var(--muted);margin:0 0 12px;font-size:16px}
.islands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.isle{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;min-width:0;transition:transform .15s}
.isle:hover{transform:translateY(-2px);border-color:var(--kelp)}
.isle .ic{font-size:36px;grid-row:span 2}
.isle h3{font-size:21px}
.isle p{margin:0;color:var(--muted);font-size:14px;line-height:1.35}
.isle .st{grid-column:1/-1;font-size:15px;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.isle.focus{border-color:var(--coral);background:linear-gradient(0deg,#fff,#fff6f3)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--coral);color:#fff}
.tag.k{background:var(--kelp)}
.plan{display:grid;gap:8px}
.day{background:var(--card);border-radius:16px;padding:10px 14px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;border:2px solid var(--line)}
.day b{font-family:var(--display);font-size:20px;color:var(--sea)}
.day span{font-size:15px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 24px rgba(10,47,69,.10)}
.passage{background:var(--sand);border-radius:18px;padding:16px 18px;margin-bottom:14px;max-height:none}
.passage h3{font-size:24px;margin-bottom:6px}
.passage p{margin:6px 0}
.passage .poem{white-space:pre-line;font-size:19px;line-height:1.6}
.passage .cap{font-size:14px;font-style:italic;color:var(--muted);border-top:2px dashed #e2cfa6;padding-top:6px;margin-top:8px}
details.ptoggle summary{cursor:pointer;font-weight:700;color:var(--sea);margin-bottom:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:15px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.half{background:var(--sun)} .dots i.now{background:var(--coral)}
.q{font-size:22px;font-weight:500;margin:4px 0 14px}
.choices{display:grid;gap:10px}
.ch{background:var(--foam);border:3px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left;font-size:19px;min-height:56px}
.ch:hover{border-color:var(--kelp)}
.ch.right{background:var(--okbg);border-color:var(--ok)}
.ch.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tip{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:17px}
.tip.ok{background:var(--okbg)} .tip.no{background:#fff5dc}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--coral);color:#fff;border:0;border-radius:16px;padding:12px 22px;font-weight:700;font-size:18px;min-height:52px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.k{background:var(--kelp)}
.btn:disabled{opacity:.5;cursor:default}
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:16px}
.slots{background:var(--foam);border:3px dashed var(--line);flex-direction:column}
.pool{padding-left:0}
.chip{background:var(--sand);border:2px solid #e6cf9f;border-radius:14px;padding:10px 14px;font-size:17px;text-align:left}
.slots .chip{background:#fff;border-color:var(--kelp)}
.slots .chip::before{content:attr(data-n) ". ";font-weight:700;color:var(--kelp)}
.end{text-align:center;padding:10px 0}
.end .big{font-family:var(--display);font-size:56px;color:var(--sea);line-height:1}
.stars{font-size:40px;letter-spacing:6px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--foam);border-radius:10px;padding:8px;word-break:break-all;text-align:left}
/* writing builder */
.topics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.topics button{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px}
.topics button.on{background:var(--sea);border-color:var(--sea);color:#fff}
.bank{background:var(--sand);border-radius:16px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.bank .w{display:inline-block;background:#fff;border-radius:99px;padding:2px 10px;margin:3px 3px 0 0;font-weight:500}
.bank .w.used{background:var(--okbg);color:var(--ok);text-decoration:line-through}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--display);font-size:20px;color:var(--sea)}
.field .hint{font-size:14px;color:var(--muted);margin:0 0 4px}
.field textarea,.field input{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:18px;background:#fff;line-height:1.45}
.field textarea{min-height:76px;resize:vertical}
.starters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.starters button{background:var(--foam);border:1.5px solid var(--line);border-radius:10px;padding:3px 10px;font-size:14px}
.labels3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{position:sticky;bottom:0;background:var(--deep);color:#fff;border-radius:18px 18px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.meter .sc{font-family:var(--display);font-size:34px;line-height:1}
.meter .mbars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-size:11px}
.meter .mbars div i{display:block;height:7px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:2px;overflow:hidden}
.meter .mbars div i b{display:block;height:100%;background:var(--sun)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:15px;margin:10px 0}
.checks div{min-width:0}
.warn{background:#fff5dc;border-radius:12px;padding:8px 12px;font-size:15px;margin:4px 0}
.ai{background:#f3fbfa;border:2px solid var(--kelp);border-radius:18px;padding:14px 16px;margin-top:12px}
.ai h3{font-size:22px;color:var(--kelp)}
.ai .fix{background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:16px}
.ai del{color:var(--bad)} .ai ins{color:var(--ok);text-decoration:none;font-weight:700}
.vn{background:var(--sand);border-radius:12px;padding:8px 12px;font-size:15px;margin-top:8px}
/* speaking */
.spk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.timer{font-family:var(--display);font-size:64px;color:var(--sea);text-align:center;line-height:1}
.frame{background:var(--sand);border-radius:14px;padding:10px 14px;font-size:17px}
.frame li{margin:4px 0}
.rub{display:grid;gap:8px;margin:10px 0}
.rub .r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--foam);border-radius:12px;padding:8px 12px;font-size:15px}
.rub .r div{display:flex;gap:2px}
.rub .r button{background:none;border:0;font-size:26px;padding:0 2px;filter:grayscale(1);opacity:.4}
.rub .r button.on{filter:none;opacity:1}
.vnbox{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:16px}
.vnbox h3{font-size:20px}
table.sk{width:100%;border-collapse:collapse;font-size:15px}
table.sk td,table.sk th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl{overflow-x:auto}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:600px){
  .islands,.spk{grid-template-columns:1fr}
  .goals{grid-template-columns:1fr;margin-top:-30px}
  .checks{grid-template-columns:1fr}
  .labels3{grid-template-columns:1fr}
  .meter .mbars{font-size:10px}
  .q{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="fx"></canvas>
<header class="hero">
  <div class="wrap">
    <div>
      <h1>Sea Power Mission</h1>

  </div>
  <svg viewBox="0 0 1200 44" preserveAspectRatio="none" aria-hidden="true"><path d="M0 24 C150 4 300 44 450 24 S750 4 900 24 S1100 40 1200 22 V44 H0Z" fill="var(--foam)"/></svg>
</header>
<main class="wrap" id="app"></main>

<script>
/* ============ CONTENT ============ */
const LINKS=["first","firstly","at first","next","then","after that","finally","at last","eventually","because","so","as a result","therefore","over time","gradually","this causes","which leads to","this means","when"];

const LEVELS={
 /* ---------- READING ---------- */
 "read-cave":{area:"reading",title:"Reading: How Is a Sea Cave Made?",skill:"doc-hieu",
  passage:{title:"How Is a Sea Cave Made?",html:`<p>Have you ever seen a dark cave at the bottom of a cliff? Sea caves are made by the power of the sea, and they take hundreds of years to form.</p>
<p><b>1</b> First, waves crash against the bottom of a cliff again and again. Every wave carries sand and small stones, which scrape the rock like sandpaper.</p>
<p><b>2</b> Next, the waves find a weak part of the rock, such as a crack. Water and air are pushed into the crack with great force, so the crack gets bigger. This wearing away of rock is called <b>erosion</b>.</p>
<p><b>3</b> Then, small pieces of rock break off and fall into the sea. Gradually, the crack becomes a hole, and the hole becomes a cave.</p>
<p><b>4</b> Finally, over many years, the cave grows deeper. Sometimes the waves break right through the cliff and make an arch.</p>
<p>As a result, the sea slowly changes the shape of our coastline. Next time you visit the beach, look closely at the cliffs!</p>
<p class="cap">Caption under the diagram: Waves repeatedly hit a weakness in the rock, gradually making the cave larger.</p>`},
  qs:[
   {q:"Is this text fiction or non-fiction?",c:["Non-fiction","Fiction","A poem"],a:0,tip:"It gives true facts and explains a process, so it is non-fiction."},
   {q:"What is the main purpose of this text?",c:["To explain how a sea cave is made","To tell a story about a pirate cave","To persuade people to visit caves"],a:0,tip:"An explanation text tells us HOW or WHY something happens.",skill:"dac-diem-explanation"},
   {q:"Which word in paragraph 2 means 'the wearing away of rock'?",c:["erosion","crack","force"],a:0,tip:"Look for the word in bold: erosion. That is precise, scientific vocabulary.",skill:"tu-khoa-hoc"},
   {type:"order",q:"Put the stages in the correct order.",w:["Waves crash against the bottom of the cliff.","The waves find a crack and make it bigger.","Small pieces of rock break off and a hole forms.","The cave grows deeper over many years."],tip:"First → Next → Then → Finally. The linking words show the order!",skill:"sap-xep-quy-trinh"},
   {q:"'…which scrape the rock like sandpaper.' What is 'like sandpaper'?",c:["A simile","Alliteration","A rhyme"],a:0,tip:"It compares two things using 'like', so it is a simile.",skill:"bien-phap-tho"},
   {q:"Why does the crack get bigger?",c:["Water and air are pushed into it with great force","People dig it with spades","The sun makes it hot"],a:0,tip:"Paragraph 2: 'Water and air are pushed into the crack with great force, SO the crack gets bigger.'"},
   {q:"Which adverb tells us HOW the crack becomes a hole?",c:["Gradually","Next","Small"],a:0,tip:"'Gradually' means slowly, little by little. Many adverbs end in -ly.",skill:"tinh-tu-trang-tu"},
   {q:"What can happen if the waves break right through the cliff?",c:["An arch is made","The cliff becomes sand straight away","A tsunami starts"],a:0,tip:"Paragraph 4: the waves can break through the cliff and make an arch."},
   {q:"Which linking words show a RESULT?",c:["As a result","First","Have you ever"],a:0,tip:"'As a result', 'so', 'therefore' and 'which leads to' show cause and effect.",skill:"tu-noi-trinh-tu"},
   {q:"Why did the writer number the paragraphs?",c:["To show the stages in a clear order","To make the text longer","Because it is a poem"],a:0,tip:"Explanation texts give information in a logical order. Numbers help the reader follow each stage.",skill:"dac-diem-explanation"},
   {q:"What is the job of the caption?",c:["It explains what the diagram shows","It is the title of the text","It tells a joke"],a:0,tip:"A caption is a sentence under a picture or diagram that explains it.",skill:"dac-diem-explanation"},
   {q:"Which sentence is written in the PRESENT simple tense, like an explanation text?",c:["The waves crash against the cliff.","The waves crashed against the cliff.","The waves will crash against the cliff."],a:0,tip:"Explanation texts use the present simple: crash, break, grow, make.",skill:"thi-hien-tai"}
  ]},
 "read-poem":{area:"reading",title:"Reading: Storm at Sea (poem)",skill:"bien-phap-tho",
  passage:{title:"Storm at Sea",html:`<div class="poem">The wild waves roar like hungry lions,
They leap and snap at the shore.
Grey gulls glide through the howling wind,
Crash! Smash! The breakers roar.

The angry sky throws silver spears,
The tired boats toss and sway.
Then slowly, softly, the storm creeps off,
And sunshine sparkles on the bay.</div>`},
  qs:[
   {q:"What is happening in the poem?",c:["A storm hits the sea, then it calms down","Children build sandcastles","A ship sinks in a calm sea"],a:0,tip:"Verse 1–2: a wild storm. The last lines: the storm creeps off and the sun comes out.",skill:"doc-hieu"},
   {q:"Find the SIMILE.",c:["roar like hungry lions","Grey gulls glide","Crash! Smash!"],a:0,tip:"A simile compares with 'like' or 'as…as'. The waves are compared to hungry lions."},
   {q:"Find the ALLITERATION.",c:["Grey gulls glide","the tired boats","the angry sky"],a:0,tip:"Grey Gulls Glide: three words close together starting with the same sound (g)."},
   {q:"'Crash! Smash!' Words that sound like the noise they describe are called…",c:["onomatopoeia","similes","rhymes"],a:0,tip:"Crash, splash, boom, whoosh are onomatopoeia."},
   {q:"'The angry sky throws silver spears.' What are the silver spears?",c:["Flashes of lightning","Real spears","Fish"],a:0,tip:"The poet imagines lightning as shiny spears thrown from the sky."},
   {q:"The sky is 'angry' and the boats are 'tired'. This is called…",c:["personification","alliteration","a caption"],a:0,tip:"Personification gives human feelings or actions to things that are not human."},
   {q:"Find a pair of rhyming words.",c:["shore / roar","waves / wind","sky / boats"],a:0,tip:"shore and roar end with the same sound. sway and bay also rhyme."},
   {q:"How does the mood change from the beginning to the end?",c:["From wild and scary to calm and peaceful","From happy to sad","It does not change"],a:0,tip:"At the start the sea is wild. At the end 'sunshine sparkles on the bay', so it feels peaceful.",skill:"doc-hieu"},
   {q:"Which is the most POWERFUL verb for the waves?",c:["leap","go","are"],a:0,tip:"Powerful verbs (leap, snap, toss, roar) help the reader picture the action.",skill:"tinh-tu-trang-tu"},
   {q:"'Then slowly, softly, the storm creeps off.' Why did the poet use 'slowly, softly'?",c:["To show the storm leaves gently and quietly","To show the storm is getting stronger","Because they rhyme"],a:0,tip:"These adverbs make the ending calm. 'creeps' also shows quiet, slow movement.",skill:"tinh-tu-trang-tu"}
  ]},
 /* ---------- WRITING LAB ---------- */
 "w-features":{area:"writing",title:"Writing Lab 1: Explanation Text Features",skill:"dac-diem-explanation",
  qs:[
   {q:"An explanation text tells us…",c:["how or why something happens","a made-up adventure story","what you did at the weekend"],a:0,tip:"Explanation = HOW or WHY. Example: How is sand made?"},
   {q:"Which is the BEST title for an explanation text?",c:["How Is Sand Made?","My Day at the Beach","sand"],a:0,tip:"A clear, interesting title often starts with How or Why and has capital letters."},
   {q:"What should the introduction do?",c:["Tell the reader what is being explained","Say goodbye to the reader","List all the diagrams"],a:0,tip:"Intro example: 'Sand is made of tiny grains of rock. But how is it made?'"},
   {q:"Which one is NOT a feature of an explanation text?",c:["Characters and talking (dialogue)","Linking words like first, next, so","Diagrams with labels and a caption"],a:0,tip:"Characters and dialogue belong in stories, not explanation texts."},
   {q:"What are LABELS on a diagram?",c:["Words that name the parts, with arrows","The last sentence of the text","A list of linking words"],a:0,tip:"Labels: cliff → cave → waves. Short words with arrows pointing to the parts."},
   {q:"Which is the best CAPTION for a diagram of a cave?",c:["Waves repeatedly hit a weakness in the rock, gradually making the cave larger.","cave","I like caves."],a:0,tip:"A caption is a full sentence that explains what is happening in the diagram."},
   {q:"Which is the best CONCLUDING sentence?",c:["As a result, the sea slowly turns huge rocks into soft sand.","The end.","and then sand happens"],a:0,tip:"A strong conclusion sums up the result. Start with 'As a result,' or 'This is why…'."},
   {q:"Explanation texts are usually written in the…",c:["present simple tense (waves crash)","past tense (waves crashed)","future tense (waves will crash)"],a:0,tip:"Facts that are always true use the present simple.",skill:"thi-hien-tai"},
   {q:"What is the logical order of an explanation?",c:["First → Next → Then → Finally","Finally → First → Then → Next","Then → Then → Then → Then"],a:0,tip:"First: what happens. Next: the next stage. Then: more detail and WHY. Finally: the result.",skill:"tu-noi-trinh-tu"},
   {q:"In the 'Then' part, the writer should also explain…",c:["WHY it happens (because… / so…)","their favourite colour","a joke"],a:0,tip:"Level up: add 'because…' or 'which means…' to explain WHY each stage happens."}
  ]},
 "w-linking":{area:"writing",title:"Writing Lab 2: Linking Word Lab",skill:"tu-noi-trinh-tu",
  qs:[
   {q:"____, rain and wind break down the rocks.",c:["First","Finally","Because"],a:0,tip:"The first stage starts with 'First,' plus a comma."},
   {q:"The rocks are near a fault line. ____, they crumble and break.",c:["As a result","However","Once upon a time"],a:0,tip:"'As a result' shows what happens BECAUSE of something."},
   {q:"The water gets shallower, ____ the first wave slows down.",c:["so","but","first"],a:0,tip:"'so' joins a cause to its result."},
   {q:"The waves smash the stones together. ____ the stones to break into tiny pieces.",c:["This causes","Next day","Finally I"],a:0,tip:"'This causes…' links a stage to what it makes happen."},
   {q:"____, the tiny pieces end up on the beach as sand.",c:["Finally","First","Because"],a:0,tip:"'Finally' introduces the last stage or the result."},
   {q:"____, over hundreds of years, the cave grows bigger.",c:["Gradually","Suddenly","Yesterday"],a:0,tip:"'Gradually' and 'over time' show something happening slowly."},
   {q:"Some sea creatures glow ____ they want to scare predators away.",c:["because","so","then"],a:0,tip:"'because' gives the REASON."},
   {q:"The light bends inside the raindrop, ____ the colours of the rainbow.",c:["which leads to","first","however"],a:0,tip:"'which leads to' joins a stage to its result in one longer sentence."},
   {q:"Which word shows an OPPOSITE idea (not a result)?",c:["however","therefore","so"],a:0,tip:"Use 'however' only for a different or opposite idea. For results use so / therefore / as a result."},
   {q:"Which sentence uses linking words best?",c:["Next, the river carries the stones to the sea, so they rub against each other.","And then the stones go and then they go to the sea.","Stones. Sea. River."],a:0,tip:"Avoid 'and then… and then'. Use Next, so, because, which leads to."},

function step(){cx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});parts=parts.filter(p=>p.l>0&&p.y<fx.height+20);if(parts.length)requestAnimationFrame(step);else cx.clearRect(0,0,fx.width,fx.height)}

function quiz(id,customQs,customTitle){
 const L=LEVELS[id]||{};const qs=customQs||L.qs;const title=customTitle||L.title;
 let i=0,score=0,tries=0;const res=[];const back=L.area==="writing"?"lab":L.area==="reading"?"reading":"home";
 const passage=L.passage?`<details class="ptoggle" open><summary>📖 ${esc(L.passage.title)} (tap to hide/show)</summary><div class="passage"><h3>${esc(L.passage.title)}</h3>${L.passage.html}</div></details>`:"";
 function render(){
  const q=qs[i];tries=0;
  const dots=qs.map((_,k)=>`<i class="${k<i?(res[k]?"ok":"half"):k===i?"now":""}"></i>`).join("");
  let body="";
  if(q.type==="order"){body=`<div class="slots" id="slots"></div><div class="pool" id="pool"></div><div class="row"><button class="btn alt" id="reset">Start again</button></div>`}
  else{const opts=shuffle(q.c.map((t,k)=>({t,k})));body=`<div class="choices">${opts.map(o=>`<button class="ch" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div>`}
  app.innerHTML=topBar(title,back)+(customQs?"":passage)+`<div class="card"><div class="qhead"><span>Question ${i+1} of ${qs.length}</span><span class="dots">${dots}</span></div><div class="q">${esc(q.q)}</div>${body}<div id="tip"></div><div class="row" style="margin-top:12px"><button class="btn k" id="next" hidden>Next →</button></div></div>`;
  wireBack();
  if(q.type==="order")orderQ(q);else app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>pick(b,q));
  const p=app.querySelector("details.ptoggle");if(p&&i>0&&innerWidth<700)p.open=false;
 }
 function correct(q){const first=tries===0;res[i]=first;score+=first?2:1;S.pearls+=first?2:1;pearls();yay();
  $("#tip").innerHTML=`<div class="tip ok">✅ ${first?"Brilliant!":"Got it!"} ${esc(q.tip)}</div>`;const n=$("#next");n.hidden=false;n.textContent=i<qs.length-1?"Next →":"See my score";n.focus();n.onclick=()=>{i++;i<qs.length?render():finish()}}
 function pick(b,q){if(b.disabled)return;const k=+b.dataset.k;
  if(k===q.a){app.querySelectorAll(".ch").forEach(x=>x.disabled=true);b.classList.add("right");correct(q)}
  else{tries++;b.classList.add("wrong");b.disabled=true;oops();$("#tip").innerHTML=`<div class="tip no">🤔 Not quite. ${tries>1?esc(q.tip):"Read it again and try once more!"}</div>`}}
 function orderQ(q){
  const slots=$("#slots"),pool=$("#pool");let placed=[];
  const pieces=shuffle(q.w.map((t,k)=>({t,k})));
  function draw(){slots.innerHTML=placed.length?placed.map((p,n)=>`<button class="chip" data-n="${n+1}" data-i="${n}">${esc(p.t)}</button>`).join(""):`<span style="color:var(--muted);font-size:15px">Tap the cards below in the right order ↓</span>`;
   pool.innerHTML=pieces.filter(p=>!placed.includes(p)).map(p=>`<button class="chip" data-k="${p.k}">${esc(p.t)}</button>`).join("");
   const isWords=q.w.every(w=>!w.includes(" "));slots.style.flexDirection=isWords?"row":"column";
   pool.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{placed.push(pieces.find(p=>p.k===+c.dataset.k));draw();if(placed.length===q.w.length)check()});
   slots.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{placed.splice(+c.dataset.i);draw()})}
  function check(){if(placed.every((p,n)=>p.k===n)){slots.querySelectorAll(".chip").forEach(c=>c.disabled=true);$("#reset").hidden=true;correct(q)}
   else{tries++;oops();slots.style.borderColor="var(--bad)";slots.animate&&slots.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:300});
    const firstWrong=placed.findIndex((p,n)=>p.k!==n);$("#tip").innerHTML=`<div class="tip no">🤔 Card ${firstWrong+1} is in the wrong place. ${tries>1?esc(q.tip):"Try again!"}</div>`;
    setTimeout(()=>{placed=placed.slice(0,firstWrong);slots.style.borderColor="";draw()},900)}}
  $("#reset").onclick=()=>{placed=[];draw()};draw();
 }
 function finish(){
  const max=qs.length*2,per={};qs.forEach((q,k)=>{const sk=q.skill||L.skill||"chung";per[sk]=per[sk]||[0,0];per[sk][1]++;if(res[k])per[sk][0]++});
  const c=logResult(id,score,max,per);const pct=score/max;const st=pct>=.9?"⭐⭐⭐":pct>=.7?"⭐⭐☆":"⭐☆☆";
  if(pct>=.7){burst();tone([523,659,784,1047],.13)}
  const weak=Object.entries(per).filter(([k,v])=>v[0]<v[1]).map(([k])=>k);
  app.innerHTML=topBar(title,back)+`<div class="card end"><div class="stars">${st}</div><div class="big">${id==="boss"?(pct*10).toFixed(1)+"/10":score+"/"+max}</div>
  <p>${pct>=.9?"Superstar! You are ready for this part.":pct>=.7?"Great work! Play once more to get 3 stars.":"Good try! Play again: you will remember the tips now."}</p>
  ${weak.length?`<p class="sub">Practise again: ${weak.length} skill${weak.length>1?"s":""} were tricky first time.</p>`:""}
  <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn alt" data-back="${back}">Back</button></div></div>`;
  wireBack();$("#again").onclick=()=>id==="boss"?boss():quiz(id,customQs,customTitle);
 }
 render();
}
function boss(){
 const pool=[];Object.entries(LEVELS).forEach(([id,L])=>L.qs.forEach(q=>pool.push(Object.assign({skill:L.skill},q))));
 const pick=shuffle(pool).slice(0,15);LEVELS.boss={area:"boss",title:"👑 Boss Battle",skill:"chung",qs:pick};

function startClock(){let left=20*60;const tick=()=>{const c=$("#clock");if(!c){clearInterval(timerInt);timerInt=null;return}c.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;if(left<=0){clearInterval(timerInt);timerInt=null;c.textContent="Time! Check capitals and full stops.";tone([880,660,440])}left--};tick();timerInt=setInterval(tick,1000)}
const FIELDS=["title","intro","s0","s1","s2","s3","concl","l0","l1","l2","cap"];
function getD(){const D={};FIELDS.forEach(k=>{const el=$("#f-"+k);D[k]=el?el.value:""});return D}

function analyse(D,T){
 const body=[D.intro,D.s0,D.s1,D.s2,D.s3,D.concl].join(" ").replace(/\s+/g," ").trim();const low=" "+body.toLowerCase()+" ";
 const words=body?body.split(/\s+/).length:0;

 const why=(low.match(/\b(because|so|this means|which means|this causes|which leads to|as a result|therefore)\b/g)||[]).length;
 const warns=[];
 const sents=[D.intro,D.s0,D.s1,D.s2,D.s3,D.concl,D.cap].flatMap(t=>t.trim()?t.trim().split(/(?<=[.!?])\s+/):[]);
 const noCap=sents.filter(s=>/^[a-z]/.test(s));if(noCap.length)warns.push(`🔠 Capital letter at the start: "${esc(noCap[0].slice(0,30))}…"`);

 if(fields.length)warns.push(`⏺️ Full stop missing at the end of: ${fields.map(f=>f[0]).join(", ")}`);
 const midCap=body.match(/[a-z,] (Like|The|And|Because|So|Then|It|They)\b/);if(midCap)warns.push(`🔡 No capital in the middle of a sentence: "${esc(midCap[1])}" → "${esc(midCap[1].toLowerCase())}"`);

 const PAST={was:"is",were:"are",broke:"break(s)",fell:"fall(s)",went:"go(es)",took:"take(s)",came:"come(s)",became:"become(s)",grew:"grow(s)",crashed:"crash(es)",smashed:"smash(es)",carried:"carry / carries",pushed:"push(es)",formed:"form(s)",caused:"cause(s)",travelled:"travel(s)"};
 const past=low.match(new RegExp("\\b("+Object.keys(PAST).join("|")+")\\b"));if(past)warns.push(`⏰ Explanation texts use the present tense: "${past[1]}" → "${PAST[past[1]]}"`);
 if((low.match(/and then/g)||[]).length>1)warns.push(`🔁 "and then" used ${(low.match(/and then/g)||[]).length} times. Swap one for Next, / After that, / so`);
 const bec=(low.match(/\bbecause\b/g)||[]).length;if(bec>3)warns.push(`🔁 "because" ${bec} times. Try so / this means / as a result`);

 const stepOK=[D.s0,D.s1,D.s2,D.s3].map(t=>t.trim().split(/\s+/).filter(Boolean).length);

  content:Math.min(5,stepOK.filter(n=>n>=10).length+(why>=2?1:0)),

}

let spIdx=0,spInt=null;
function speaking(){
 const P=SPEAK[spIdx];const R=(S.speak[P.id]&&S.speak[P.id].r)||[0,0,0,0,0];
 app.innerHTML=topBar("Speaking Cove")+`
 <h2 class="section-h" style="margin-top:4px">Speaking Cove 🗣️</h2>
 <p class="sub">Read the frame, press Start, talk for 1 minute. A grown-up gives the stars.</p>
 <div class="topics">${SPEAK.map((s,n)=>`<button data-sp="${n}" class="${n===spIdx?"on":""}">${S.speak[s.id]?"✅ ":""}${esc(s.t)}</button>`).join("")}</div>
 <div class="spk">
  <div class="card"><span class="tag k">${esc(P.k)}</span><h3 style="font-size:26px;margin:8px 0">${esc(P.t)}</h3>
   <ol class="frame">${P.frame.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <div class="row" style="margin-top:10px"><button class="btn alt" id="listen">🔊 Listen to a model</button><button class="btn alt" id="showM">Show model</button></div>
   <p id="model" hidden style="font-size:16px;background:var(--foam);border-radius:12px;padding:10px 12px">${esc(P.model)}</p>
  </div>
  <div class="card"><div class="timer" id="t">1:00</div>
   <div class="row" style="justify-content:center;margin:10px 0"><button class="btn" id="go">▶ Start talking</button></div>
   <p style="font-size:15px;margin:0 0 4px"><b>Grown-up: give 1–5 stars</b></p>
   <div class="rub">${RUBRIC.map((r,n)=>`<div class="r"><span>${r}</span><div>${[1,2,3,4,5].map(v=>`<button data-r="${n}" data-v="${v}" class="${R[n]>=v?"on":""}" aria-label="${v} stars">⭐</button>`).join("")}</div></div>`).join("")}</div>
   <div class="row"><b style="font-family:var(--display);font-size:26px" id="rs">${R.reduce((a,b)=>a+b,0)}/25</b><button class="btn k" id="saveS">Save score</button></div>
   <p class="sub" style="margin-top:8px">Tips: look at the listener, speak slowly, use full sentences. Aim for 21/25.</p>
  </div>
 </div>`;
 wireBack();
 app.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{spIdx=+b.dataset.sp;clearInterval(spInt);speechSynthesis&&speechSynthesis.cancel();speaking()});
 $("#showM").onclick=()=>{$("#model").hidden=!$("#model").hidden};
 $("#listen").onclick=()=>{try{const u=new SpeechSynthesisUtterance(P.model);u.lang="en-GB";u.rate=.9;const v=speechSynthesis.getVoices().find(v=>/en-GB/.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){$("#model").hidden=false}};
 $("#go").onclick=()=>{clearInterval(spInt);let left=60;const t=$("#t");$("#go").textContent="↺ Restart";tone([523,784]);spInt=setInterval(()=>{left--;if(!$("#t")){clearInterval(spInt);return}t.textContent=`0:${String(Math.max(0,left)).padStart(2,"0")}`;if(left<=0){clearInterval(spInt);t.textContent="Time! 🎉";yay()}},1000)};
 app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{R[+b.dataset.r]=+b.dataset.v;app.querySelectorAll(`[data-r="${b.dataset.r}"]`).forEach(x=>x.classList.toggle("on",+x.dataset.v<=R[+b.dataset.r]));$("#rs").textContent=R.reduce((a,b)=>a+b,0)+"/25"});
 $("#saveS").onclick=()=>{const tot=R.reduce((a,b)=>a+b,0);if(!tot)return;S.speak[P.id]={r:R.slice(),when:stamp()};S.pearls+=Math.round(tot/2);logResult("speak-"+P.id,tot,25,{noi:[tot,25]});pearls();if(tot>=21){burst()}yay();$("#saveS").textContent="Saved ✓"};
}

/* ============ BOOT ============ */
function start(){home()}
start();
</script>
