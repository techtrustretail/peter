<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Quest – Unit 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f5ff; --bg2:#d3ecff; --card:#ffffff; --ink:#1d2b53; --muted:#53618a;
  --sky:#3d8bfd; --sun:#ffcf3f; --grass:#2fb36f; --coral:#ff5d5d; --pink:#ff8fb7;
  --line:#c9def2; --soft:#f2f8ff; --shadow:#1d2b5322;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a33; --bg2:#18234a; --card:#1f2a4d; --ink:#f2f5ff; --muted:#aab6d8;
    --line:#33427a; --soft:#25335c; --shadow:#00000055;
  }
}
:root[data-theme="dark"]{
  --bg:#121a33; --bg2:#18234a; --card:#1f2a4d; --ink:#f2f5ff; --muted:#aab6d8;
  --line:#33427a; --soft:#25335c; --shadow:#00000055;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100%;
  background:var(--bg);
  background-image:radial-gradient(circle at 15% 10%,var(--bg2) 0 120px,transparent 121px),
                   radial-gradient(circle at 90% 85%,var(--bg2) 0 160px,transparent 161px);
  color:var(--ink);
  font-family:'Baloo 2',"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
  font-size:18px; line-height:1.35;
}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#app{max-width:820px;margin:0 auto;padding:16px 16px 40px}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:clamp(28px,6vw,44px);line-height:1;margin:0;font-weight:800;letter-spacing:-.5px}
.top .sub{color:var(--muted);font-weight:600;font-size:17px}
.logo{font-size:44px}
.back{border:none;background:var(--card);border-radius:14px;padding:6px 14px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line)}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.lvl{
  border:3px solid var(--line);background:var(--card);border-radius:24px;
  padding:18px;text-align:left;box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;gap:4px;transition:transform .12s;
}
.lvl:hover{transform:translateY(-3px)}
.lvl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.lvl .em{font-size:48px;line-height:1}
.lvl .t{font-size:24px;font-weight:800}
.lvl .d{color:var(--muted);font-weight:600}
.lvl .st{font-size:24px;letter-spacing:2px;margin-top:4px}
.intro{background:var(--card);border-radius:20px;padding:14px 18px;margin-bottom:16px;border:3px dashed var(--line);font-weight:600}

/* play */
.bar{height:16px;background:var(--card);border-radius:99px;overflow:hidden;border:2px solid var(--line);margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--grass);border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border-radius:28px;padding:22px 18px;box-shadow:0 8px 0 var(--line);text-align:center}
.qno{color:var(--muted);font-weight:700}
.prompt{font-size:clamp(20px,4.5vw,26px);font-weight:700;margin:6px 0 14px}
.cmp{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.big{font-size:clamp(30px,8vw,52px);font-weight:800;background:var(--soft);padding:4px 16px;border-radius:18px}
.slot{width:78px;height:78px;border:4px dashed var(--sky);border-radius:20px;display:grid;place-items:center;font-size:52px;font-weight:800;color:var(--sky)}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ch{
  min-width:96px;border:none;border-radius:20px;padding:10px 20px;
  font-size:clamp(22px,5vw,30px);font-weight:800;background:var(--sun);color:#1d2b53;
  box-shadow:0 6px 0 #d9a514;transition:transform .08s;
}
.ch.sym{font-size:44px;width:96px;padding:2px 0}
.ch:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a514}
.ch.good{background:var(--grass);color:#fff;box-shadow:0 6px 0 #1f8a52}
.ch.bad{background:var(--coral);color:#fff;box-shadow:0 6px 0 #c63c3c}
.ch:disabled{cursor:default}

/* ordering */
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0 18px}
.tile{border:none;border-radius:18px;padding:10px 16px;font-size:clamp(20px,4.8vw,28px);font-weight:800;background:var(--sun);color:#1d2b53;box-shadow:0 6px 0 #d9a514}
.tile.used{visibility:hidden}
.tile small{display:block;font-size:15px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:70px;padding:10px;border-radius:20px;background:var(--soft);border:3px dashed var(--line)}
.placed{background:var(--grass);color:#fff;border-radius:16px;padding:8px 14px;font-size:clamp(18px,4.5vw,24px);font-weight:800;animation:pop .25s}
.placed small{display:block;font-size:14px}
.dir{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);margin:6px 4px 0}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

/* number line */
.nl{width:100%;max-width:640px;margin:0 auto 14px;display:block}
.nl text{font-family:inherit;font-weight:700;fill:var(--ink)}
.hint{border:none;background:none;color:var(--sky);font-weight:700;font-size:17px;text-decoration:underline;margin-top:10px}
.hinttxt{margin-top:8px;color:var(--muted);font-weight:600}

/* feedback */
.fb{margin-top:18px;border-radius:20px;padding:14px 16px;font-weight:700;text-align:left;animation:pop .25s}
.fb.ok{background:#d9f7e7;color:#14653c}
.fb.no{background:#ffe1e1;color:#9a2424}
.fb .h{font-size:24px}
.next{display:block;margin:16px auto 0;border:none;border-radius:20px;padding:10px 34px;font-size:24px;font-weight:800;background:var(--sky);color:#fff;box-shadow:0 6px 0 #2563c9}
.next:active{transform:translateY(4px);box-shadow:0 2px 0 #2563c9}

/* end */
.end{text-align:center}
.end .stars{font-size:64px;letter-spacing:6px}
.end .score{font-size:28px;font-weight:800}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
const fmt=n=>n.toLocaleString('en-US');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

let best={};
try{best=JSON.parse(localStorage.getItem('nq-best')||'{}')||{}}catch(e){best={}}
function saveBest(){try{localStorage.setItem('nq-best',JSON.stringify(best))}catch(e){}}

/* --- sounds --- */
let ac=null;
function beep(ok){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[523,659,784]:[300,220];
    notes.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=ok?'triangle':'square';o.frequency.value=f;
      g.gain.setValueAtTime(.12,ac.currentTime+i*.1);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.1+.18);
      o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.1);o.stop(ac.currentTime+i*.1+.2);
    });
  }catch(e){}
}
const cheers=['Great job!','Super!','You got it!','Brilliant!','Awesome!','Fantastic!'];
const cheer=()=>cheers[rnd(0,cheers.length-1)];

/* --- question builders --- */
function sign(a,b){return a>b?'>':a<b?'<':'='}

function buildCompare(){
  const ws=[[48726,52401],[100000,99999],[307560,304980],[706215,706125],[830000,803000],[125430,125340]];
  const qs=ws.map(([a,b])=>({type:'compare',a,b}));
  for(let i=0;i<3;i++){
    const a=rnd(100000,999999);
    const p=[10,100,1000,10000][rnd(0,3)];
    let b=a+(Math.random()<.5?-1:1)*p*rnd(1,3);
    qs.push({type:'compare',a,b});
  }
  const e=rnd(100000,999999);qs.push({type:'compare',a:e,b:e});
  return shuffle(qs);
}

function buildOrder(){
  return [
    {type:'order',nums:[54210,12905,54021,45002],dir:'up'},
    {type:'order',nums:[608320,600832,680203,606238],dir:'up'},
    {type:'order',nums:[314900,341090,309418,413009],dir:'down'},
    {type:'order',nums:[999999,909999,990099,900909],dir:'down'}
  ];
}

const PLACES=[10,100,1000,10000,100000];
function roundQ(n,p){
  const lower=Math.floor(n/p)*p, upper=lower+p;
  const ans=Math.round(n/p)*p;
  const nd=Math.floor(n/(p/10))%10;
  const dir=nd>=5?'round up':'round down';
  return {
    type:'choice',
    prompt:`Round <b>${fmt(n)}</b> to the nearest <b>${fmt(p)}</b>`,
    line:{lo:lower,hi:upper,n},
    choices:shuffle([lower,upper]).map(fmt),
    answer:fmt(ans),
    hint:`Look at the ${placeName(p/10)} digit: it is <b>${nd}</b>.`,
    explain:`The next digit is ${nd} (${nd>=5?'5 or more':'4 or less'}), so we ${dir} to ${fmt(ans)}.`
  };
}
function placeName(v){return {1:'ones',10:'tens',100:'hundreds',1000:'thousands',10000:'ten thousands'}[v]}
function buildRound(){
  const nums=[7346,28659,305427,672891,1349560,4986231];
  const all=[];nums.forEach(n=>PLACES.forEach(p=>all.push([n,p])));
  // make sure every number appears at least twice
  const picked=[];
  nums.forEach(n=>{const opts=shuffle(PLACES).slice(0,2);opts.forEach(p=>picked.push([n,p]))});
  return shuffle(picked).map(([n,p])=>roundQ(n,p));
}

function buildIsland(){
  return [
    Object.assign(roundQ(287460,10000),{intro:'🎢 A theme park had <b>287,460</b> visitors last year.'}),
    Object.assign(roundQ(305892,10000),{intro:'🎢 This year it had <b>305,892</b> visitors.'}),
    {type:'choice',intro:'🎢 Last year ≈ <b>290,000</b> &nbsp; This year ≈ <b>310,000</b>',
      prompt:'About how many <b>more</b> visitors came this year?',
      choices:['10,000','20,000','30,000','100,000'],answer:'20,000',
      hint:'Take away: 310,000 − 290,000',
      explain:'310,000 − 290,000 = 20,000. About 20,000 more visitors!'},
    {type:'order',intro:'🏝️ Four islands have these populations.',
      nums:[54320,49806,60125,58907],labels:['Island A','Island B','Island C','Island D'],dir:'up'},
    {type:'choice',intro:'🏝️ A: 54,320 &nbsp; B: 49,806 &nbsp; C: 60,125 &nbsp; D: 58,907',
      prompt:'Round each to the nearest 10,000. Which island has the greatest population when rounded?',
      choices:['Island A','Island C','Island D','Islands C and D'],answer:'Islands C and D',
      hint:'Round each one: is it closer to 50,000 or 60,000?',
      explain:'A → 50,000, B → 50,000, C → 60,000, D → 60,000. Islands C and D are both 60,000!'}
  ];
}

const LEVELS=[
  {id:'compare',title:'Compare Castle',emoji:'🏰',desc:'Use <, > or =',build:buildCompare},
  {id:'order',title:'Order Ocean',emoji:'🐳',desc:'Put the numbers in order',build:buildOrder},
  {id:'round',title:'Rounding Rocket',emoji:'🚀',desc:'Round to 10, 100, 1,000…',build:buildRound},
  {id:'island',title:'Puzzle Island',emoji:'🏝️',desc:'Solve number stories',build:buildIsland}
];

/* --- screens --- */
function starStr(n){return '⭐'.repeat(n)+'☆'.repeat(3-n)}

function home(){
  app.innerHTML=`
  <div class="top"><span class="logo">🧭</span><div><h1>Number Quest</h1><div class="sub">Unit 9: Comparing and rounding</div></div></div>
  <div class="intro">Pick an island to play. Win up to 3 stars on each one! ⭐⭐⭐</div>
  <div class="map">${LEVELS.map((l,i)=>`
    <button class="lvl" data-i="${i}">
      <span class="em">${l.emoji}</span><span class="t">${l.title}</span>
      <span class="d">${l.desc.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>
      <span class="st">${starStr(best[l.id]||0)}</span>
    </button>`).join('')}
  </div>`;
  app.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>start(+b.dataset.i));
}

let S=null;
function start(i){
  const L=LEVELS[i];
  S={L,i,qs:L.build(),k:0,score:0};
  render();
}

function header(){
  return `<div class="top"><button class="back" id="back">← Map</button>
    <div><div style="font-size:26px;font-weight:800">${S.L.emoji} ${S.L.title}</div></div></div>
    <div class="bar"><i style="width:${S.k/S.qs.length*100}%"></i></div>`;
}

function render(){
  const q=S.qs[S.k];
  let body='';
  const intro=q.intro?`<div class="prompt" style="font-weight:600">${q.intro}</div>`:'';
  if(q.type==='compare'){
    body=`<div class="prompt">Which sign is correct?</div>
      <div class="cmp"><span class="big">${fmt(q.a)}</span><span class="slot" id="slot">?</span><span class="big">${fmt(q.b)}</span></div>
      <div class="choices">${['<','=','>'].map(s=>`<button class="ch sym" data-v="${s}">${s.replace('<','&lt;').replace('>','&gt;')}</button>`).join('')}</div>
      <div class="dir" style="justify-content:center;gap:18px"><span>&lt; less than</span><span>= equal to</span><span>&gt; greater than</span></div>`;
  }else if(q.type==='order'){
    const up=q.dir==='up';
    q.order=q.nums.map((n,j)=>j).sort((x,y)=>up?q.nums[x]-q.nums[y]:q.nums[y]-q.nums[x]);
    q.pos=0;q.miss=0;
    const items=shuffle(q.nums.map((n,j)=>j));
    body=`${intro}<div class="prompt">Tap the numbers from <b>${up?'smallest to largest':'largest to smallest'}</b></div>
      <div class="tiles">${items.map(j=>`<button class="tile" data-j="${j}">${q.labels?`<small>${q.labels[j]}</small>`:''}${fmt(q.nums[j])}</button>`).join('')}</div>
      <div class="row" id="row"></div>
      <div class="dir"><span>${up?'smallest':'largest'}</span><span>${up?'largest':'smallest'}</span></div>`;
  }else{
    body=`${intro}<div class="prompt">${q.prompt}</div>${q.line?lineSVG(q.line):''}
      <div class="choices">${q.choices.map(c=>`<button class="ch" data-v="${c}">${c}</button>`).join('')}</div>
      <button class="hint" id="hint">💡 Need a hint?</button><div class="hinttxt" id="ht"></div>`;
  }
  app.innerHTML=header()+`<div class="qcard"><div class="qno">Question ${S.k+1} of ${S.qs.length}</div>${body}<div id="fb"></div></div>`;
  document.getElementById('back').onclick=home;
  const h=document.getElementById('hint');
  if(h)h.onclick=()=>{document.getElementById('ht').innerHTML=q.hint;h.remove()};
  if(q.type==='order')bindOrder(q);
  else app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(q,b));
}

function lineSVG({lo,hi,n}){
  const x0=40,x1=600,mid=(lo+hi)/2;
  const x=x0+(n-lo)/(hi-lo)*(x1-x0), xm=(x0+x1)/2;
  return `<svg class="nl" viewBox="0 0 640 120" role="img" aria-label="Number line from ${fmt(lo)} to ${fmt(hi)}">
    <line x1="${x0}" y1="70" x2="${x1+16}" y2="70" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M${x1+18} 70 l-12 -8 v16z" fill="currentColor"/>
    <line x1="${x0}" y1="56" x2="${x0}" y2="84" stroke="currentColor" stroke-width="4"/>
    <line x1="${x1}" y1="56" x2="${x1}" y2="84" stroke="currentColor" stroke-width="4"/>
    <line x1="${xm}" y1="58" x2="${xm}" y2="82" stroke="#ff5d5d" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="${x0}" y="108" text-anchor="middle" font-size="18">${fmt(lo)}</text>
    <text x="${xm}" y="108" text-anchor="middle" font-size="16" style="fill:#ff5d5d">${fmt(mid)}</text>
    <text x="${x1}" y="108" text-anchor="middle" font-size="18">${fmt(hi)}</text>
    <circle cx="${x}" cy="70" r="10" fill="#3d8bfd" stroke="#fff" stroke-width="3"/>
    <text x="${Math.min(Math.max(x,70),570)}" y="40" text-anchor="middle" font-size="20" style="fill:#3d8bfd">${fmt(n)}</text>
  </svg>`;
}

function answer(q,btn){
  const v=btn.dataset.v;
  const right=q.type==='compare'?sign(q.a,q.b):q.answer;
  const ok=v===right;
  app.querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(b.dataset.v===right)b.classList.add('good')});
  if(!ok)btn.classList.add('bad');
  if(q.type==='compare'){
    const s=document.getElementById('slot');s.textContent=right;s.style.borderStyle='solid';
  }
  let explain='';
  if(q.type==='compare'){
    explain=q.a===q.b?'Both numbers are exactly the same.'
      :`${fmt(Math.max(q.a,q.b))} is bigger. Compare the digits from the left until one is different!`;
  }else explain=q.explain||'';
  feedback(ok,explain);
}

function bindOrder(q){
  const row=document.getElementById('row');
  app.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    const j=+t.dataset.j;
    if(j===q.order[q.pos]){
      beepSoft();
      t.classList.add('used');
      row.insertAdjacentHTML('beforeend',`<span class="placed">${q.labels?`<small>${q.labels[j]}</small>`:''}${fmt(q.nums[j])}</span>`);
      q.pos++;
      if(q.pos===q.nums.length){
        const ok=q.miss===0;
        feedback(ok,ok?'Perfect order, no mistakes!':`Done! You had ${q.miss} wrong tap${q.miss>1?'s':''}. Remember: compare digits from the left.`,true);
      }
    }else{
      q.miss++;
      t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');
      beep(false);
    }
  });
}
function beepSoft(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=660;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.13);}catch(e){}
}

function feedback(ok,explain,silentFail){
  if(ok)S.score++;
  if(ok||!silentFail)beep(ok);
  const last=S.k===S.qs.length-1;
  document.getElementById('fb').innerHTML=`
    <div class="fb ${ok?'ok':'no'}"><div class="h">${ok?'✅ '+cheer():'💪 Nice try!'}</div>${explain}</div>
    <button class="next" id="next">${last?'See my stars':'Next'}</button>`;
  const n=document.getElementById('next');n.focus();
  n.onclick=()=>{S.k++; if(S.k<S.qs.length)render(); else finish();};
}

function finish(){
  const pct=S.score/S.qs.length;
  const st=pct>=.9?3:pct>=.6?2:1;
  if(st>(best[S.L.id]||0)){best[S.L.id]=st;saveBest();}
  app.innerHTML=`
    <div class="top"><button class="back" id="back">← Map</button></div>
    <div class="qcard end">
      <div style="font-size:72px">${S.L.emoji}</div>
      <div class="stars">${starStr(st)}</div>
      <div class="score">${S.score} out of ${S.qs.length} correct</div>
      <p style="font-weight:600;color:var(--muted)">${st===3?'Amazing! You are a number champion!':st===2?'Well done! Play again to get 3 stars.':'Good start! Try again – you will get better!'}</p>
      <div class="choices">
        <button class="next" id="again">Play again</button>
        <button class="next" id="map" style="background:var(--grass);box-shadow:0 6px 0 #1f8a52">Back to map</button>
      </div>
    </div>`;
  document.getElementById('back').onclick=home;
  document.getElementById('map').onclick=home;
  document.getElementById('again').onclick=()=>start(S.i);
  if(st>=2)confetti();
}

function confetti(){
  const e=['🎉','⭐','🎈','✨','🏆'];
  for(let i=0;i<30;i++){
    const s=document.createElement('span');s.className='confetti';
    s.textContent=e[rnd(0,e.length-1)];
    s.style.left=rnd(0,100)+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';
    s.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),5000);
  }
}

home();
