<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phi hành gia Toán học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --night:#140f3d; --night2:#241a66; --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.16); --text:#f7f4ff; --muted:#bdb5ea;
  --star:#ffd23f; --star-d:#c79a00; --pink:#ff6fae; --pink-d:#c43f7c; --mint:#46e0bd; --mint-d:#1f9e82;
  --sky:#7cc6ff; --red:#ff5d6c; --yellow:#ffc93c; --green:#3ddc97;
  --font:"Baloo 2","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#140f3d;--night2:#241a66;--text:#f7f4ff;--muted:#bdb5ea}}
:root[data-theme="dark"]{--night:#140f3d;--night2:#241a66;--text:#f7f4ff;--muted:#bdb5ea}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:#140f3d}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,var(--night2),var(--night) 60%) fixed,var(--night);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:14px 16px 40px;min-height:100vh}
img,svg{max-width:100%}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:20px;padding:14px 26px;border-radius:999px;background:var(--star);color:#2a1d00;box-shadow:0 6px 0 var(--star-d);transition:transform .08s,box-shadow .08s;min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--star-d)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-d)}
.btn.pink:active{box-shadow:0 2px 0 var(--pink-d)}
.btn.mint{background:var(--mint);color:#06332a;box-shadow:0 6px 0 var(--mint-d)}
.btn.mint:active{box-shadow:0 2px 0 var(--mint-d)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn.ghost:active{box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.wide{width:100%}
.btn.sm{font-size:16px;padding:8px 16px;min-height:42px}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:16px;padding:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.center{text-align:center}
.muted{color:var(--muted)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:20px}

/* home */
.title{font-size:clamp(38px,11vw,58px);font-weight:800;text-align:center;line-height:.95;letter-spacing:-.5px;color:var(--star);text-shadow:0 4px 0 #6b3ea8,0 0 30px rgba(255,210,63,.35);margin-top:6px}
.title small{display:block;font-size:.5em;color:var(--text);text-shadow:0 3px 0 #6b3ea8;letter-spacing:0}
.subtitle{text-align:center;color:var(--muted);font-weight:600;margin:8px 0 4px}
.hero-rocket{display:flex;justify-content:center;margin:6px 0 2px}
.hero-rocket svg{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.name-input{width:100%;font-family:inherit;font-size:24px;font-weight:700;padding:14px 20px;border-radius:20px;border:3px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);text-align:center}
.name-input::placeholder{color:#8a82bd}
.journey{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;padding:6px 4px 0;position:relative}
.journey::before{content:"";position:absolute;left:8%;right:8%;top:42%;border-top:3px dashed rgba(255,255,255,.2)}
.jp{display:flex;flex-direction:column;align-items:center;position:relative;font-size:13px;font-weight:700;color:var(--muted);flex:1}
.jp svg{width:100%;max-width:58px;height:auto}
.jp.done{color:var(--green)}
.jp.lock svg{opacity:.45;filter:grayscale(.6)}
.rank-pill{display:inline-block;background:var(--panel2);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px;color:var(--sky)}

/* play */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.icon-btn{width:46px;height:46px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.starcount svg{width:24px;height:24px}
.starcount{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:6px 14px;border-radius:999px;font-weight:800;font-size:20px}
.progress{display:flex;gap:6px;justify-content:center}
.progress i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
.progress i.ok{background:var(--star)} .progress i.no{background:var(--red)} .progress i.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.planet-tag{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.planet-tag svg{width:34px;height:34px}
.fuel{height:14px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:4px 0 12px;position:relative}
.fuel b{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px;transform-origin:left}
.fuel.low b{background:linear-gradient(90deg,var(--red),var(--yellow))}
.fuel-label{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.qcard{background:var(--panel);border:2px solid var(--line);border-radius:32px;padding:18px 14px 22px;text-align:center;position:relative}
.qtext{font-size:clamp(40px,12.5vw,76px);font-weight:800;line-height:1;letter-spacing:1px;margin:8px 0 6px;white-space:nowrap}
.qtext .box{display:inline-block;min-width:.95em;border:5px dashed var(--star);border-radius:18px;padding:0 .08em;color:var(--star)}
.qtext .q{color:var(--star)}
.visual{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;min-height:10px;margin:6px 0 4px}
.grp{display:flex;flex-wrap:wrap;gap:4px;max-width:150px;justify-content:center}
.grp svg{width:28px;height:28px}
.plus{font-size:34px;font-weight:800;color:var(--muted)}
.frame{display:grid;grid-template-columns:repeat(5,24px);gap:4px;padding:6px;border-radius:10px;border:2px solid rgba(255,255,255,.3)}
.frame i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08)}
.frame i.y{background:var(--star)} .frame i.p{background:var(--pink)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.choice{position:relative;aspect-ratio:1;border-radius:50%;font-size:clamp(34px,10vw,46px);font-weight:800;color:#fff;display:grid;place-items:center;box-shadow:inset -10px -12px 0 rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.3);transition:transform .1s}
.choice:active{transform:scale(.94)}
.choice::after{content:"";position:absolute;width:26%;height:18%;top:16%;left:20%;border-radius:50%;background:rgba(255,255,255,.3)}
.choice.c0{background:#7b5cff}.choice.c1{background:#ff6fae}.choice.c2{background:#1fb8a0}
.choice.right{box-shadow:0 0 0 6px var(--green),0 0 30px var(--green)}
.choice.wrong{opacity:.4}
.answer-slot{display:inline-block;min-width:2.4ch;border-bottom:6px solid var(--star);font-size:54px;font-weight:800;min-height:1.15em;line-height:1.1;margin-top:8px;color:var(--star)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.key{font-size:30px;font-weight:800;padding:10px 0;border-radius:20px;background:var(--panel2);box-shadow:0 5px 0 rgba(0,0,0,.35);min-height:62px}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.key.ok{background:var(--mint);color:#06332a;box-shadow:0 5px 0 var(--mint-d)}
.key.del{font-size:22px}

.feedback{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;animation:up .25s ease-out}
.feedback.good{background:#1d7d62}
.feedback.bad{background:#5b2a6e}
.feedback .inner{max-width:560px;margin:0 auto}
.feedback h3{font-size:28px;margin-bottom:4px}
.feedback p{margin:4px 0 14px;font-size:18px}
@keyframes up{from{transform:translateY(100%)}}

.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,6,40,.82);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.gift{text-align:center;max-width:380px}
.gift-box{width:180px;height:180px;margin:10px auto;background:none;padding:0}
.gift-box.shake svg{animation:shake 1s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.reveal{position:relative;width:200px;height:200px;margin:0 auto;display:grid;place-items:center}
.reveal::before{content:"";position:absolute;inset:-20px;background:repeating-conic-gradient(rgba(255,210,63,.28) 0 12deg,transparent 12deg 30deg);border-radius:50%;animation:spin 8s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
.reveal>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}

.big-planet{display:flex;justify-content:center;margin:10px 0}
.big-planet svg{width:170px;height:170px}
.h2{font-size:34px;font-weight:800;text-align:center}
.stars-row{display:flex;justify-content:center;gap:6px;margin:10px 0}
.stars-row svg{width:40px;height:40px}
.stars-row span{display:inline-flex}
.stars-row .off{opacity:.2}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;font-weight:700}
.bar-row svg{width:34px;height:34px}
.bar{height:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.bar b{display:block;height:100%;border-radius:999px}
.tip{background:rgba(124,198,255,.12);border-left:6px solid var(--sky);border-radius:14px;padding:12px 14px;font-size:17px}
.tip.warm{background:rgba(255,111,174,.12);border-left-color:var(--pink)}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-row{display:grid;grid-template-columns:40px 40px 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:20px;padding:8px 14px;border:2px solid transparent}
.lb-row.me{border-color:var(--star);background:rgba(255,210,63,.1)}
.lb-row .pos{font-size:22px;font-weight:800;text-align:center}
.lb-row .nm{font-weight:800;font-size:19px;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.lb-row .nm small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.lb-row .sc{font-weight:800;font-size:20px;display:flex;align-items:center;gap:4px}
.lb-row .sc svg{width:22px;height:22px}
.lb-row svg.mini{height:40px;width:auto}

/* collection */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.cell{background:var(--panel);border-radius:20px;padding:8px 4px;text-align:center;font-size:14px;font-weight:700;border:3px solid transparent}
.cell svg{width:64px;height:64px}
.cell.locked svg{filter:brightness(0) opacity(.35)}
.cell.locked{color:var(--muted)}
button.cell{color:var(--text)}
button.cell.sel{border-color:var(--star)}
.hangar{display:flex;justify-content:center;padding:10px;background:radial-gradient(circle,rgba(124,198,255,.2),transparent 70%)}
.section-h{font-size:22px;font-weight:800;margin:6px 0 8px}

/* teacher */
.table-wrap{overflow-x:auto;border-radius:18px;border:2px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--panel2);font-weight:700;font-size:13px;line-height:1.2}
td.nm{text-align:left;font-weight:800;cursor:pointer;color:var(--sky);text-decoration:underline}
.chip{display:inline-block;min-width:48px;padding:2px 6px;border-radius:10px;font-weight:800;color:#1b1030}
.chip.g{background:var(--green)}.chip.y{background:var(--yellow)}.chip.r{background:var(--red);color:#fff}.chip.n{background:rgba(255,255,255,.12);color:var(--muted)}
.skill-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sk{background:var(--panel);border-radius:18px;padding:12px;font-size:15px}
.sk .top{display:flex;align-items:center;gap:8px;font-weight:800}
.sk .top svg{width:30px;height:30px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}
.pin-dots{font-size:40px;letter-spacing:10px;text-align:center;min-height:56px}
.notice{font-size:14px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#3a2a8c;padding:10px 18px;border-radius:16px;z-index:40;font-size:15px;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.4)}

.particle{position:fixed;z-index:25;pointer-events:none;width:26px;height:26px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .particle{display:none}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main id="app"></main>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $app=document.getElementById('app');
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'phi-hanh-gia'}
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- data ---------- */
const PLANETS=[
 {id:'moon',name:'Mặt Trăng',skill:'Cộng trong phạm vi 10',mode:'choice',timer:0,desc:'Đếm các ngôi sao rồi chọn đáp án đúng.'},
 {id:'mars',name:'Sao Hỏa',skill:'Cộng tròn 10',mode:'choice',timer:0,desc:'Tìm những cặp số làm tròn 10.'},
 {id:'jupiter',name:'Sao Mộc',skill:'Cộng không nhớ đến 20',mode:'choice',timer:15,desc:'Nhanh tay lên! Tàu chỉ đủ nhiên liệu cho 15 giây mỗi câu.'},
 {id:'saturn',name:'Sao Thổ',skill:'Cộng qua 10 (có nhớ)',mode:'type',timer:15,desc:'Tự bấm số đáp án. Mỗi câu có 15 giây.'},
 {id:'sun',name:'Mặt Trời',skill:'Tìm số còn thiếu',mode:'type',timer:20,desc:'Thử thách cuối: tìm số còn thiếu trong ô trống. Mỗi câu có 20 giây.'}
];
const TIPS={
 moon:'Đếm tiếp từ số lớn hơn: 3 + 5 → bắt đầu từ 5, đếm thêm 3 là 6, 7, 8.',
 mars:'Nhớ các cặp số làm tròn 10: 1 + 9, 2 + 8, 3 + 7, 4 + 6, 5 + 5.',
 jupiter:'Cộng hàng đơn vị trước, giữ nguyên 1 chục: 13 + 4 → 3 + 4 = 7 → 17.',
 saturn:'Tách số để làm tròn 10: 8 + 5 → 8 + 2 = 10, rồi 10 + 3 = 13.',
 sun:'Đếm tiếp từ số đã cho đến kết quả: 7 + ? = 12 → 8, 9, 10, 11, 12 là 5 bước.'
};
const RANKS=['Tân binh','Phi công Mặt Trăng','Phi công Sao Hỏa','Phi công Sao Mộc','Phi công Sao Thổ','Chỉ huy vũ trụ'];
const COLORS={red:['#ff5d6c','Đỏ'],blue:['#4aa8ff','Xanh dương'],yellow:['#ffc93c','Vàng'],purple:['#a77bff','Tím'],pink:['#ff7fc8','Hồng'],mint:['#46e0bd','Xanh ngọc']};
const WINGS=['Cánh nhỏ','Cánh tia chớp','Cánh ngôi sao'];
const FLAMES=[['#ff9f1c','Lửa cam'],['#5ad1ff','Lửa xanh'],['#c77dff','Lửa tím']];
const ALIENS=[
 {n:'Bíp',c:'#46e0bd',e:1,a:1,s:0},{n:'Bốp',c:'#ff7fc8',e:2,a:2,s:1},{n:'Xíu',c:'#ffc93c',e:3,a:0,s:2},
 {n:'Mập',c:'#a77bff',e:2,a:1,s:3},{n:'Tí Nị',c:'#7cc6ff',e:1,a:2,s:2},{n:'Lấp Lánh',c:'#ff9f5a',e:3,a:1,s:0},
 {n:'Kẹo',c:'#ff5d8f',e:2,a:0,s:0},{n:'Bông',c:'#e7e2ff',e:1,a:1,s:1},{n:'Xoáy',c:'#3ddc97',e:2,a:2,s:3},{n:'Tròn Vo',c:'#ffd23f',e:3,a:2,s:1}
];
const GIFT_POOL=[...ALIENS.map((_,i)=>'a'+i),'c-purple','c-pink','c-mint','w-1','w-2','f-1','f-2'];
const BASE_OWNED=['c-red','c-blue','c-yellow','w-0','f-0'];

/* ---------- svg art ---------- */
function starSVG(fill){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z" fill="${fill||'#ffd23f'}" stroke="#fff3" stroke-width="1"/></svg>`}
function rocketSVG(ship,h){
 ship=ship||{}; h=h||90;
 const c=(COLORS[ship.color]||COLORS.red)[0], f=(FLAMES[ship.flame||0]||FLAMES[0])[0];
 let wings;
 if(ship.wing===1) wings=`<path d="M19 46 L2 88 L22 80Z" fill="${c}" stroke="#0003" stroke-width="2"/><path d="M41 46 L58 88 L38 80Z" fill="${c}" stroke="#0003" stroke-width="2"/><path d="M10 72 L6 80 M50 72 L54 80" stroke="#fff" stroke-width="3"/>`;
 else if(ship.wing===2) wings=`<path d="M19 58 L5 80 L21 79Z" fill="#fff"/><path d="M41 58 L55 80 L39 79Z" fill="#fff"/><path d="M5 72l1.5 3 3.3.4-2.4 2.3.6 3.3L5 79.4 2 81l.6-3.3L.2 75.4l3.3-.4z" fill="#ffd23f"/><path d="M55 72l1.5 3 3.3.4-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.4z" fill="#ffd23f"/>`;
 else wings=`<path d="M19 60 L7 84 L21 80Z" fill="#fff"/><path d="M41 60 L53 84 L39 80Z" fill="#fff"/>`;
 return `<svg viewBox="0 0 60 104" height="${h}" width="${Math.round(h*0.58)}" aria-hidden="true">
  <path class="flame" d="M21 80 Q30 106 39 80Z" fill="${f}"/><path d="M25 80 Q30 95 35 80Z" fill="#fff6c2"/>
  ${wings}
  <path d="M30 3 C45 18 46 46 42 82 L18 82 C14 46 15 18 30 3Z" fill="${c}"/>
  <path d="M30 3 C38 12 42 24 43 36 L17 36 C18 24 22 12 30 3Z" fill="#fff" opacity=".9"/>
  <path d="M18 82 C16 62 16 50 17 40 L22 40 C21 52 21 64 22 82Z" fill="#0002"/>
  <circle cx="30" cy="48" r="8.5" fill="#bfe9ff" stroke="#fff" stroke-width="3"/><circle cx="27" cy="45" r="2.5" fill="#fff"/>
  <rect x="19" y="68" width="22" height="5" rx="2.5" fill="#fff" opacity=".55"/></svg>`;
}
function alienSVG(i,size){
 const A=ALIENS[i]; size=size||64; const dk='#241a4f';
 let body;
 if(A.s===0) body=`<circle cx="40" cy="48" r="25" fill="${A.c}"/>`;

const Store={
 mode:'local',db:null,players:LS.get('phg-players',{}),pin:LS.get('phg-pin','1234'),subs:[],q:{},ready:false,
 on(f){this.subs.push(f)},emit(){this.subs.forEach(f=>{try{f()}catch(e){console.error(e)}})},
 get(id){return this.players[id]?clone(this.players[id]):null},
 async init(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db)return;
  const localMe=S.me&&this.players[S.me]?clone(this.players[S.me]):null;
  this.db=db;this.mode='db';
  db.collection('players').onSnapshot(snap=>{
   const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=clone(d.data())});
   this.players=o;
   if(!this.ready){this.ready=true;if(localMe&&!o[localMe.id])this.save(localMe)}
   this.emit();
  },err=>{console.warn('db',err)});
  db.doc('config/app').onSnapshot(s=>{if(s.exists&&s.data().pin){this.pin=String(s.data().pin);this.emit()}},()=>{});
 },
 save(p){
  this.players[p.id]=clone(p);
  if(this.mode!=='db'){LS.set('phg-players',this.players);return Promise.resolve()}
  const body=clone(p),prev=this.q[p.id]||Promise.resolve();
  const next=prev.then(()=>this.db.doc('players/'+p.id).set(body)).catch(e=>this.fail(e));
  this.q[p.id]=next;return next;
 },
 del(id){
  delete this.players[id];
  if(this.mode!=='db'){LS.set('phg-players',this.players);this.emit();return}
  this.db.doc('players/'+id).delete().catch(e=>this.fail(e));this.emit();
 },
 setPin(pin){
  this.pin=pin;
  if(this.mode!=='db'){LS.set('phg-pin',pin);return}
  this.db.doc('config/app').set({pin}).catch(e=>this.fail(e));
 },
 fail(e){
  console.warn('save failed',e);
  if(e&&e.code==='unavailable')return;
  if(this.mode==='db'){this.mode='local';LS.set('phg-players',this.players);toast('Chưa lưu được lên bảng chung của lớp. Kết quả sẽ lưu trên máy này.')}
 }
};

/* ---------- sound ---------- */
let AC=null;
function tone(fs,dur,type){
 if(S.muted)return;dur=dur||.12;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const s=t+i*dur;
   g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.18,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+dur*1.8);
   o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur*2)});}catch(e){}
}
const sfx={good:()=>tone([660,880,1175],.09,'triangle'),bad:()=>tone([330,262],.16,'sine'),gift:()=>tone([523,659,784,1047,1319],.08,'triangle'),tap:()=>tone([520],.04,'sine')};

/* ---------- fx ---------- */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3800)}
function burst(x,y){
 if(reduceMotion)return;
 for(let i=0;i<12;i++){const p=document.createElement('div');p.className='particle';p.innerHTML=starSVG(pick(['#ffd23f','#ff6fae','#46e0bd','#7cc6ff']));
  p.style.left=(x-13)+'px';p.style.top=(y-13)+'px';document.body.appendChild(p);
  const a=Math.PI*2*i/12+Math.random()*.4,d=80+Math.random()*90;
  p.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(1) rotate(${rand(-180,180)}deg)`,opacity:0}],{duration:800+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove();}
}

/* ---------- question generation ---------- */
function makeChoices(ans){
 const c=new Set([ans]);const cand=shuffle([ans-1,ans+1,ans-2,ans+2,ans+3,ans-3].filter(n=>n>=0&&n<=20));
 for(const n of cand){if(c.size>=3)break;c.add(n)}
 return shuffle([...c]);
}
function genQ(pid,idx,seen){
 let q,key,guard=0;
 do{
  if(pid==='moon'){const a=rand(1,8),b=rand(1,10-a);q={a,b,ans:a+b}}
  else if(pid==='mars'){
   if(Math.random()<.6){const a=rand(1,9);q={a,b:10-a,ans:10,kind:'pair'}}
   else{const b=rand(1,9);q=Math.random()<.5?{a:10,b,ans:10+b,kind:'ten'}:{a:b,b:10,ans:10+b,kind:'ten'}}
  }
  else if(pid==='jupiter'){const x=rand(1,7),y=rand(1,9-x);q=Math.random()<.65?{a:10+x,b:y,ans:10+x+y}:{a:y,b:10+x,ans:10+x+y};q.vis=idx<3}
  else if(pid==='saturn'){const a=rand(3,9),b=rand(11-a,9);q=Math.random()<.5?{a,b,ans:a+b}:{a:b,b:a,ans:a+b}}
  else{const m=rand(2,9),a=rand(3,20-m);q={a,m,c:a+m,ans:m,missing:true,pos:Math.random()<.7?'right':'left'}}
  key=q.missing?q.a+'?'+q.c+q.pos:q.a+'+'+q.b;
 }while(seen.has(key)&&++guard<60);
 seen.add(key);q.pid=pid;
 q.text=q.missing?(q.pos==='right'?`${q.a} + ? = ${q.c}`:`? + ${q.a} = ${q.c}`):`${q.a} + ${q.b} = ?`;
 if(PLANETS.find(p=>p.id===pid).mode==='choice')q.choices=makeChoices(q.ans);
 return q;
}
function genPlanet(pi){const seen=new Set();return [0,1,2,3,4].map(i=>genQ(PLANETS[pi].id,i,seen))}
function hint(q){
 const {pid}=q;
 if(pid==='moon'){const big=Math.max(q.a,q.b),sm=Math.min(q.a,q.b);const seq=[];for(let i=1;i<=sm;i++)seq.push(big+i);
  return `Bắt đầu từ <b>${big}</b>, đếm thêm ${sm}: ${seq.join(', ')}. Vậy ${q.a} + ${q.b} = <b>${q.ans}</b>.`}
 if(pid==='mars'){if(q.kind==='pair')return `${q.a} và ${q.b} là cặp số làm tròn 10. Vậy ${q.a} + ${q.b} = <b>10</b>.`;
  const u=q.ans-10;return `1 chục và ${u} đơn vị là <b>${q.ans}</b>. Vậy ${q.a} + ${q.b} = <b>${q.ans}</b>.`}
 if(pid==='jupiter'){const t=Math.max(q.a,q.b),u=Math.min(q.a,q.b);return `Cộng hàng đơn vị: ${t-10} + ${u} = ${t-10+u}. Giữ nguyên 1 chục, được <b>${q.ans}</b>.`}
 if(pid==='saturn'){const big=Math.max(q.a,q.b),sm=Math.min(q.a,q.b),need=10-big,rest=sm-need;
  return `Tách ${sm} = ${need} + ${rest}. Lấy ${big} + ${need} = 10, rồi 10 + ${rest} = <b>${q.ans}</b>.`}
 return `Đếm tiếp từ ${q.a} đến ${q.c}: cần thêm ${q.m} bước. Thử lại: ${q.a} + ${q.m} = ${q.c}. Số cần tìm là <b>${q.m}</b>.`;
}

/* ---------- visuals for questions ---------- */
function starGroup(n,color){let s='';for(let i=0;i<n;i++)s+=starSVG(color);return `<div class="grp">${s}</div>`}
function frame(y,p){let s='';for(let i=0;i<10;i++)s+=`<i class="${i<y?'y':i<y+p?'p':''}"></i>`;return `<div class="frame" aria-hidden="true">${s}</div>`}
function visualFor(q){
 if(q.pid==='moon')return starGroup(q.a,'#ffd23f')+'<span class="plus">+</span>'+starGroup(q.b,'#ff6fae');
 if(q.pid==='mars'){if(q.kind==='pair')return frame(q.a,q.b);const u=q.ans-10;return q.a===10?frame(10,0)+'<span class="plus">+</span>'+frame(0,u):frame(0,u)+'<span class="plus">+</span>'+frame(10,0)}
 if(q.pid==='jupiter'&&q.vis){const t=Math.max(q.a,q.b),u=Math.min(q.a,q.b);return frame(10,0)+frame(t-10,u)}
 return '';
}

 const top=Object.values(g).sort((a,b)=>b.n-a.n).slice(0,8);

  <div><button class="btn sm ghost" data-act="delp" data-v="${esc(p.id)}">${S.delArm===p.id?'Chạm lần nữa để xóa hẳn':'Xóa học sinh này'}</button></div></div>`;

/* ---------- game flow ---------- */
function startRun(){S.run={pi:0,qi:0,qs:genPlanet(0),cur:[],stars:0,correct:0,answers:[],start:Date.now(),typed:'',locked:false};go('intro')}
function beginQuestion(){S.run.typed='';S.run.locked=false;S.run.qStart=performance.now();go('play');startTimer()}
function startTimer(){
 const pl=PLANETS[S.run.pi];if(!pl.timer)return;
 const dur=pl.timer*1000,t0=S.run.qStart;
 const tick=()=>{const bar=document.getElementById('fuelbar');if(!bar||S.screen!=='play'||S.run.locked){timerRAF=null;return}
  const left=Math.max(0,dur-(performance.now()-t0));bar.style.transform=`scaleX(${left/dur})`;
  const sec=document.getElementById('secs');if(sec)sec.textContent=Math.ceil(left/1000)+'s';
  const f=document.getElementById('fuel');if(f)f.classList.toggle('low',left<dur*.3);
  if(left<=0){timerRAF=null;answer(null);return}
  timerRAF=requestAnimationFrame(tick)};
 timerRAF=requestAnimationFrame(tick);
}
function answer(val,el){
 const r=S.run;if(!r||r.locked)return;r.locked=true;stopTimer();
 const q=r.qs[r.qi],ms=Math.round(performance.now()-r.qStart),ok=val===q.ans;
 r.cur[r.qi]=ok;r.answers.push({p:q.pid,q:q.text,a:q.ans,g:val,ok,ms});
 if(el&&PLANETS[r.pi].mode==='choice'){document.querySelectorAll('.choice').forEach(b=>{const v=+b.dataset.v;if(v===q.ans)b.classList.add('right');else b.classList.add('wrong')})}
 const fb=document.createElement('div');
 if(ok){r.stars++;r.correct++;sfx.good();
  const sc=document.getElementById('sc');if(sc)sc.querySelector('span').textContent=r.stars;
  const box=(el||document.getElementById('qcard')).getBoundingClientRect();burst(box.left+box.width/2,box.top+box.height/2);
  fb.className='feedback good';fb.innerHTML=`<div class="inner"><h3>${pick(['Giỏi quá!','Chính xác!','Tuyệt vời!','Siêu phi hành gia!','Đúng rồi!'])} +1 ⭐</h3><p>${esc(q.text.replace('?',q.ans))}</p></div>`;
  document.body.appendChild(fb);
  setTimeout(()=>{fb.remove();if(r.correct%5===0)showGift(()=>advance());else advance()},reduceMotion?600:1000);
 }else{sfx.bad();
  fb.className='feedback bad';fb.innerHTML=`<div class="inner"><h3>${val==null?'Hết nhiên liệu rồi!':'Gần đúng rồi, cùng xem nhé!'}</h3><p>${hint(q)}</p><button class="btn wide" id="cont">Tiếp tục</button></div>`;
  document.body.appendChild(fb);const b=fb.querySelector('#cont');b.focus();b.onclick=()=>{fb.remove();advance()};
 }
}
function advance(){const r=S.run;r.qi++;if(r.qi<5)beginQuestion();else{savePlanet();go('planetDone')}}
function savePlanet(){
 const r=S.run,pl=PLANETS[r.pi],p=me();if(!p)return;
 const a=r.answers.filter(x=>x.p===pl.id);
 const s=p.skills[pl.id]||{c:0,t:0,ms:0};s.c+=a.filter(x=>x.ok).length;s.t+=a.length;s.ms+=a.reduce((x,y)=>x+y.ms,0);p.skills[pl.id]=s;
 a.filter(x=>!x.ok).forEach(x=>p.mistakes.push({p:x.p,q:x.q,a:x.a,g:x.g,at:Date.now()}));
 p.mistakes=p.mistakes.slice(-40);
 if(a.filter(x=>x.ok).length>=3)p.rank=Math.max(p.rank||0,r.pi+1);
 p.last=Date.now();Store.save(p);
}
function finishRun(){
 const r=S.run,p=me();r.total=Date.now()-r.start;
 if(p){p.plays++;p.lifetimeStars+=r.stars;
  r.newBest=r.stars>p.bestStars||(r.stars===p.bestStars&&r.stars>0&&(!p.bestTime||r.total<p.bestTime));
  if(r.newBest){p.bestStars=r.stars;p.bestTime=r.total}
  p.runs=(p.runs||[]).concat([{stars:r.stars,time:r.total,at:Date.now()}]).slice(-15);
  Store.save(p);}
 go('result');
}
function showGift(done){
 const p=me();const ov=document.createElement('div');ov.className='overlay';
 ov.innerHTML=`<div class="gift"><h2 class="h2">Hộp quà bí mật!</h2><p>Em đã trả lời đúng ${S.run.correct} câu.</p><button class="gift-box shake" id="gbox" aria-label="Mở hộp quà">${giftSVG()}</button><p style="font-weight:800;font-size:20px">Chạm để mở quà!</p></div>`;
 document.body.appendChild(ov);sfx.tap();ov.querySelector('#gbox').focus();
 ov.querySelector('#gbox').onclick=()=>{
  let item=null,label='',art='';
  if(p){const left=GIFT_POOL.filter(x=>!p.owned.includes(x));
   if(left.length){item=pick(left);p.owned.push(item)}else{p.lifetimeStars+=3}
   Store.save(p)}
  if(!item){label='Sao băng may mắn! +3 sao';art=`<div style="width:140px">${starSVG()}</div>`}
  else if(item[0]==='a'){const i=+item.slice(1);label=`Bạn mới: ${ALIENS[i].n}!`;art=alienSVG(i,150)}
  else if(item[0]==='c'){const k=item.slice(2);label=`Màu tàu mới: ${COLORS[k][1]}!`;art=rocketSVG({color:k,wing:p.ship.wing,flame:p.ship.flame},150)}
  else if(item[0]==='w'){const i=+item.slice(2);label=`${WINGS[i]} cho tàu!`;art=rocketSVG({color:p.ship.color,wing:i,flame:p.ship.flame},150)}
  else{const i=+item.slice(2);label=`${FLAMES[i][1]} cho tàu!`;art=rocketSVG({color:p.ship.color,wing:p.ship.wing,flame:i},150)}
  sfx.gift();
  ov.innerHTML=`<div class="gift"><div class="reveal">${art}</div><h2 class="h2" style="margin-top:10px">${esc(label)}</h2><p class="muted">${item&&item[0]!=='a'?'Vào "Tàu & quà" để lắp lên tàu nhé.':'Đã thêm vào bộ sưu tập của em.'}</p><button class="btn wide" id="gok">Nhận quà</button></div>`;
  const b=ov.querySelector('#gok');b.focus();b.onclick=()=>{ov.remove();done()};
 };
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,v=t.dataset.v;
 switch(act){
  case 'mute':S.muted=!S.muted;LS.set('phg-muted',S.muted);t.textContent=S.muted?'🔇':'🔊';break;
  case 'join':{const inp=document.getElementById('nm');const name=(inp.value||'').trim().replace(/\s+/g,' ');
   if(!name){inp.focus();toast('Em hãy nhập tên nhé!');return}
   const id=slug(name);let p=Store.get(id);const fresh=!p;
   if(!p){p=newPlayer(name);Store.save(p)}
   S.me=id;LS.set('phg-me',id);
   if(!fresh)toast('Chào mừng '+p.name+' quay lại!');
   go(fresh?'hangar':'home');break}
  case 'logout':S.me=null;LS.set('phg-me',null);go('home');break;
  case 'home':go('home');break;
  case 'hangar':go('hangar');break;
  case 'board':go('board');break;
  case 'teacher':S.pinEntry='';S.teacherOk=false;S.openRow=null;go('teacher');break;
  case 'setc':case 'setw':case 'setf':{const p=me();if(!p)return;if(act==='setc')p.ship.color=v;if(act==='setw')p.ship.wing=+v;if(act==='setf')p.ship.flame=+v;sfx.tap();Store.save(p);render();break}
  case 'start':if(!me()){go('home');return}startRun();break;
  case 'land':beginQuestion();break;
  case 'pick':answer(+v,t);break;
  case 'key':if(S.run.locked)return;if(S.run.typed.length<2){S.run.typed+=v;sfx.tap();document.getElementById('slot').textContent=S.run.typed}break;
  case 'del':if(S.run.locked)return;S.run.typed=S.run.typed.slice(0,-1);document.getElementById('slot').textContent=S.run.typed;break;
  case 'submit':if(S.run.locked||!S.run.typed)return;answer(parseInt(S.run.typed,10));break;
  case 'nextplanet':{const r=S.run;r.pi++;r.qi=0;r.qs=genPlanet(r.pi);r.cur=[];go('intro');break}
  case 'finish':finishRun();break;
  case 'quit':document.querySelectorAll('.feedback,.overlay').forEach(x=>x.remove());S.run=null;go('home');break;
  case 'pin':if(S.pinEntry.length<6){S.pinEntry+=v;render()}break;
  case 'pindel':S.pinEntry=S.pinEntry.slice(0,-1);render();break;
  case 'pinok':if(S.pinEntry===String(Store.pin)){S.teacherOk=true;render()}else{S.pinEntry='';render();toast('Mã PIN chưa đúng.')}break;
  case 'tlogout':S.teacherOk=false;go('home');break;
  case 'row':S.openRow=S.openRow===v?null:v;S.delArm=null;render();break;
  case 'delp':if(S.delArm===v){Store.del(v);S.delArm=null;S.openRow=null;if(S.me===v){S.me=null;LS.set('phg-me',null)}render()}else{S.delArm=v;render()}break;
  case 'savepin':{const n=(document.getElementById('newpin').value||'').trim();if(!/^\d{4,6}$/.test(n)){toast('Mã PIN cần 4 đến 6 chữ số.');return}Store.setPin(n);toast('Đã đổi mã PIN.');document.getElementById('newpin').value='';break}
 }
});
document.addEventListener('keydown',e=>{
 if(S.screen==='home'&&e.key==='Enter'&&document.activeElement&&document.activeElement.id==='nm'){document.querySelector('[data-act="join"]').click();return}
 if(S.screen!=='play'||!S.run||S.run.locked)return;
 const pl=PLANETS[S.run.pi];
 if(pl.mode==='type'){
  if(/^\d$/.test(e.key)&&S.run.typed.length<2){S.run.typed+=e.key;document.getElementById('slot').textContent=S.run.typed}
  else if(e.key==='Backspace'){S.run.typed=S.run.typed.slice(0,-1);document.getElementById('slot').textContent=S.run.typed}
  else if(e.key==='Enter'&&S.run.typed){answer(parseInt(S.run.typed,10))}
 }
});

 if(S.screen==='home'){const n=document.getElementById('nm');if(n&&window.innerWidth>700)n.focus()}
}

(function(){
 const cv=document.getElementById('sky'),ctx=cv.getContext('2d');let stars=[],W=0,H=0;
 function size(){const d=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:.5+Math.random()*1.5,c:Math.random()<.12?pick(['#ffd23f','#ff9fcf','#9fe8ff']):'#ffffff'}));draw(0)}
 function draw(t){ctx.clearRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=reduceMotion?.7:.35+.65*Math.abs(Math.sin(s.p+t*.001*s.s));ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}ctx.globalAlpha=1}
 function loop(t){draw(t);requestAnimationFrame(loop)}
 window.addEventListener('resize',size);size();if(!reduceMotion)requestAnimationFrame(loop);
})();

render();
Store.init();
})();
